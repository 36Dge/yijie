product_ux:
  status: PASS
  primary_user: 在本机易界聊天中输入文件并接收任务生成文件的用户
  problem: 附件展示与目标胶囊不一致，输入SVG/MP4与输出MD/DOCX/PPTX存在缺口，路径提示和各格式保存/预览需统一
  user_outcome: 12扩展名可导入发送、真实接收、显示类型预览卡，并按既有能力预览内容与另存生成原件
  in_scope:
    - 12扩展名输入与原生产物接收校验
    - 输入胶囊/临时路径tooltip/受draft授权的图片hover
    - 本地提交/native消息/历史三态的胶囊与正文组合
    - 生成卡片分级预览、已有provider不重复登记
    - 生成原件保存与已Native提交资源恢复
    - 全部输入包装/reader兼容及现有机制复用
  out_of_scope:
    - 新增Office/PDF内容阅读器/模型摘要、视频理解/OCR/转码/探测器
    - Runtime核心/patch、新MCP注册/动态工具/专家执行通道
    - 新增执行器/存储/播放器/传输或通用协商服务
    - 建设12类生成引擎或新付费图片/视频供应商
    - 输入附件另存服务/路径持久字段/公开发布/日常重要数据迁移
  main_flow:
    - 现有canonical local入口及Native权限
    - 原子导入/准备胶囊
    - 临时路径或受权图片hover并发送
    - 现有视图adapter分别展示本地附件与原生userMessage，保留两类事实
    - 工作区文件走原publisher，已有provider保留原链/ID/provenance
    - 同一spool/资源流到Native校验提交再ACK
    - 分级预览卡/生成原件另存/已提交内容正常恢复
  visual_direction: 参考5图；易界现有tokens/YjIcon，全圆角流式胶囊，生成端复用ArtifactShell分类卡片；详见brief R-02—05
  ui_states:
    idle: 已有输入框提示及可选文件
    loading: 现有批次准备/真实接收阶段/按需预览，无依据不造百分比
    success: 附件ready可发送；Native提交后产物ready，Host staged/ACK与用户保存区分
    empty: 空消息不发送，无产物不造空卡片
    error: 保留正文和此前成功草稿；批次错误沿原子导入处理，预览和保存失败分开
    retry: 导入失败移除重选，传输/预览复用已有重试，不自动重跑任务
    cancel: 正常取消保存、移除草稿、关闭租约；不删除原件或改原生终态
must_acceptance:
  - id: AC-001
    statement: 12扩展逐一真实导入/识别/发送和产物接收；普通/已选工具/专家聊天输入契约一致，旧格式与既有producer保留
    verification: 普通安全样本分批走实际入口与Runtime登记，至少一项现有工具生成任务闭环；不要求12种生成引擎或新增付费供应商；见02-verification.md
    status: PASS
  - id: AC-002
    statement: 输入胶囊/icon/名称/换行、非图片真实路径tooltip及局部移除成立
    verification: 单多件、中文长名、同名异路径、无来源路径；鼠标/键盘；路径不进模型/日志/持久消息；见02-verification.md
    status: PASS
  - id: AC-003
    statement: png/jpg/jpeg/svg图片hover/focus取代tooltip；正常关闭/移除/换会话释放；MP4不自动播放
    verification: 四图片扩展逐项普通样本和正常生命周期；见02-verification.md
    status: PASS
  - id: AC-004
    statement: 单胶囊+正文、多文件、无文字在本地提交/native观察/历史分页重开均正确展示（可独立排列），原生userMessage不变、无重复；无本地绑定的冷历史不猜关联
    verification: 真实选集/普通纯附件/native观察与App重开通过；Owner接受真实Native分页＋store组合回归的分层证据，UI加载更多按钮未实测；见02第11节
    status: PASS
  - id: AC-005
    statement: 12格式预览卡片分级准确；DOCX/PPTX/PDF文件信息和保存可用，TXT/CSV/MD有界内容、HTML交互、SVG缩放、MP4音画/seek及关闭正常
    verification: canonical App按R-01逐项；超预览源限额说明且可保存，不以卡片/metadata代替内容或音画；见02-verification.md
    status: PASS
  - id: AC-006
    statement: 12扩展名原件保存字节一致、.jpeg合法命名、取消/同名确认正确；预览失败不误阻有效保存
    verification: 原生保存与SHA-256/字节比较；正常取消，不破坏文件制造失败；见02-verification.md
    status: PASS
  - id: AC-007
    statement: 已Native提交的附件/产物在保留期内正常重开，未提交/过期/缺失如实反馈，不承诺Host重启重投递或自动重生成
    verification: 正常重开真实UI必验；过期/缺失优先自然记录，无记录则以普通纯值reader/组件状态检查验证，不改时间/权限/数据库；仍无覆盖则本AC不得PASS；见02-verification.md
    status: PASS
  - id: AC-008
    statement: 混合批次、正常超限/不支持/拒绝/取消及重试可恢复，正文保留且无重复派发/伪终态
    verification: 10件/超限普通文件、正常不支持类型、取消重选；不用攻击样本；见02-verification.md
    status: PASS
  - id: AC-009
    statement: 固定Runtime、已有生产者/登记/spool/ACK/预览保存复用，完整输入包装与历史reader兼容；新值只向能消费的端发出
    verification: source-first及同源校验，旧生产者混合/登记幂等/无重复卡；保留既有受支持模型配置，不在K31开启被禁dynamic tools；见02-verification.md
    status: PASS
  - id: AC-010
    statement: 当前主题/最小窗口/键盘可完成胶囊和卡片关键动作，资源正常释放，无路径越权扩散
    verification: focused组件+真实UI正常观察/关闭，不做攻击注入或强杀；见02-verification.md
    status: PASS
