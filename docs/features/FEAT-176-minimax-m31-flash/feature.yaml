documentation_task:
  contract_impact: none
  technical_design_status: proposed
  technical_design_revision: 3
  reviewed_at: '2026-11-25'
  audit_evidence: 02-verification.md#共享链基线
  implementation_authorized: false
  user_decisions:
    - 新增 MiniMax M3.1-Flash，默认思考深度 xhigh，与 MiniMax M3 共用 API Key。
    - 新建聊天框和模型目录均默认 Flash。
    - 本机未公开产品可整套直接升级，历史聊天、已保存计划和历史回执兼容不在需求内。
    - Flash 与现有模型的同类事件必须共用易界对话流及聊天框的处理与展示规则。确有新特性或协议差异时允许适配。

conversation_event_presentation:
  requirement: 相同的原生事件事实、权限与生命周期进入同一套 Host 投影、Native 归并和持久化、Vue 阅读索引与交互组件。
  design: 01-delivery-log.md#同类事件的处理与展示
  acceptance: 02-verification.md#同类事件的对照验收
  native_item_coverage:
    messages: [userMessage, agentMessage, unpublishedText, reasoning]
    tools: [commandExecution, mcpToolCall, fileChange, imageView, subAgentActivity]
    search: [webSearch]
    fallback: [unknown]
  related_fact_examples: [item/started, item/agentMessage/delta, item/agentMessage/previewDelta, item/completed, contextCompaction, thread/tokenUsage/updated, turn/plan/updated, turn/started, turn/completed, error]
  reading_surfaces: [联网搜索, 工具调用与产物, 连续活动分组, 上下文压缩提示, 聊天框上下文, 正文与审批及终态]
  exception_rule: 有协议依据则在接入侧归一化。现有契约无法表达的新语义需登记脱敏样本、兼容降级、共享契约扩展与既有模型回归。
  acceptance_ids: [AC-004, AC-005, AC-006, AC-007, AC-009, AC-010]

model_definition:
  profile_id: minimax-m3-1-flash-xhigh-v1
  label: MiniMax M3.1-Flash
  provider: minimax
  model: MiniMax-M3.1-Flash
