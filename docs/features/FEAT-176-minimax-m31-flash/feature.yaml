product_ux:
  status: pending
  primary_user: 使用本机易界进行对话、专家工作及创建计划的用户
  problem: Flash 尚未注册，普通新聊天与模型目录各有独立默认值，现有 Host 执行准入无法派发 xhigh。
  user_outcome: 无需输入第二把 Key 或手选模型，打开新聊天即可获得 Flash/xhigh 的实际回答。
  in_scope:
    - 活动 v2 模型契约、两个默认值、共享凭据及真实 Responses 请求
    - 受管原生 model/list 默认项、SSE、多轮、子代理、Guardian、压缩、搜索来源及用量
    - 正常入口的可选 Kimi 网页服务就绪判断和仅 MiniMax 模型凭据的冷启动
    - 本版普通与专家聊天、市场与技能、附件、标题、计划草案及计划执行
    - 本版 SQL 写入、同批制品启动和本地完整用户流程
    - 相同事件在普通和专家会话的实时、终态与本版重开中的共用处理、展示和交互对照
  out_of_scope:
    - 历史聊天、已保存计划、旧回执与跨版本混跑兼容
    - 本版之外的额外 effort 选择界面、新视频输入及新媒体生成供应商
    - 公开部署、共享运营凭据平台和生产迁移
  main_flow:
    - 从易界正常本地入口进入新聊天，目录和输入框声明同一默认项。
    - 显式 profile 随 Native 提交进入 Host，经固定 Codex Runtime 使用 M3 凭据发送 Flash/xhigh。
    - 原生流式回答、工具及用量返回到本轮，用户可以停止或在空闲时切换模型。
  visual_direction: 沿用模型按钮、回答徽标、搜索和工具卡、活动组、压缩行与输入框上下文控件。模型名称和实际统计保留各自归属。
  ui_states:
    idle: 新聊天预选 Flash，目录就绪后可发送。
    loading: 读取目录或切换中有状态反馈，发送暂时锁定。
    success: 显示本次回答、有效模型标签及原生过程。
    empty: 合法目录四项均不可用时展示各项原因，零项或缺项响应提示目录不一致并可刷新。
    error: 本地受理前保留草稿，受理后保留该轮输入与失败原因。用户可明确改选另一可用模型。
    retry: 先读取已派发请求状态，新请求由用户显式发起。
    cancel: 关闭菜单仅取消选择，运行中停止走原生 turn/interrupt。

must_acceptance:
  - id: AC-001
    statement: 新聊天和目录默认 Flash，首条提交使用同一 ID，草稿允许手选其他模型。
    verification: 对照易界四项 profile、原生 model/list 唯一 isDefault 与 xhigh、首次提交及下个新草稿。
    status: pending
  - id: AC-002
    statement: Flash 与 M3 复用唯一 MiniMax 凭据，配置与账户资格问题可辨认。
    verification: 网页执行器未运行时用单一 MiniMax 模型凭据从两个正常入口启动，核对轮换、独立 Kimi 网页服务可用情况及供应商样本。
    status: pending
  - id: AC-003
    statement: 每次 Flash 默认请求均实际发送 MiniMax-M3.1-Flash 与嵌套 reasoning.effort=xhigh。
    verification: 对照普通 turns、permission-turns、线程回执和首轮、多轮、工具结果后续的实际 Responses 请求。
    status: pending
  - id: AC-004
    statement: 同一新版会话空闲切换正确，模型身份、revision 和回执匹配。
    verification: 验证两处 Native 回执解码、同 provider 不同模型的匹配、手选、revision 及忙态锁定。
    status: pending
  - id: AC-005
    statement: 附件、流式回答与停止沿用原生事实。压缩提示和聊天框上下文各走既有组件。
    verification: 四种压缩状态按 thread/turn/item 原位归并，窗口核对最近实测、零值、未知、上次模型归属与交互，再核对压缩 effort 和正常停止。
    status: pending
  - id: AC-006
    statement: 工具可续答，子代理及使用 Flash 的审核按 xhigh 执行。同类工具行、连续活动分组、计数和展开均共用原规则。
    verification: 核对工具生命周期、审批与专用后端，验证 72 个原生 Item 组成一组 40 次调用、公开说明分组、多动作单次调用及首个回答收起行为。
    status: pending
  - id: AC-007
    statement: 原生搜索和 MCP 检索各走其现有卡片，来源依搜索项归属，专家与市场遵循原有权限。
    verification: 核对原生搜索/开页/页内查找、MCP 回执、来源标题回填、缺失状态和只读交互，兼测独立网页服务有无配置。
    status: pending
  - id: AC-008
    statement: 标题和 input-only 草案使用有效 profile，新计划按经审阅的执行模型运行。
    verification: 核对实际 text.format、严格 JSON 解码及失败出口，再核对从草案到表单的模型选择和三种计划目标。
    status: pending
  - id: AC-009
    statement: 同批本机组件可启动，能写入、读出本版 Flash 会话、计划及回执。
    verification: 正常 Native 打开与重开均激活 0052，核对五类写入、暂停 Kimi 时的 Flash 派发、readyz 与 v1/status 的事实及本版重开的事件顺序和分组。
    status: pending
  - id: AC-010
    statement: 正常 UI 默认 Flash 完成真实回答，受理与计费有据。实际接入路径的同类事件经同一条公共链产生一致的阅读结果。
    verification: 核对真实供应商、实际请求与界面关联，按用途记录尝试。以 M3 对照 Flash，以 Kimi 样本回归，比较 Native 事实与实时、终态、同版重开及只读交互。
    status: pending

