schema_version: 3
delivery_profile: "demo_fast"
exposure: "local"

feature:
  id: "FEAT-128"
  slug: "structured-chat-artifacts-real-image-generation"
  title: "对话流真实图片生成 Demo 快速闭环"
  status: "usable"
  created_at: "2026-08-23"
  requirement_owner: "段成威"
  technical_owner: "段成威"
  reviewer: "段成威"
  release_owner: "段成威"

scope:
  risk_level: "high"
  data_classification: "confidential"
  contract_impact: "semantic"
  database_change: "none"
  persistence_change: "durable"
  runtime_change: "runtime"
  auth_permission_change: "auth"
  user_workflow_change: "user_visible"
  ui_change: "interactive"
  ai_behavior_change: "tool"

repositories:
  - "yijie"
  - "yijie-agent-host"
  - "yijie-desktop"

timebox:
  target_hours: 12
  hard_stop_hours: 16
  no_progress_minutes: 30
  same_blocker_minutes: 90
  non_core_limit_minutes: 120
  core_blocker_minutes: 240

product_ux:
  status: "PASS"
  primary_user: "在 macOS Desktop 中快速验证本地 Chat 的 Owner"
  problem: "用户要求生成图片时，MiniMax-M3 只能返回文字提示词，现有 v3 图片 Artifact 只能展示 synthetic 图片。"
  user_outcome: "用户在同一轮对话中直接获得 image-01 真实图片，可预览并保存；也可用当前轮一张人物图片保持主体特征生成新图。"
  in_scope:
    - "MiniMax-M3 通过 Runtime canonical dynamic tool 决定是否调用 generate_image"
    - "固定中国区 MiniMax image-01、base64、n=1 的文生图"
    - "当前轮单张 PNG/JPEG 人物附件作为 subject_reference.character 的参考图生图"
    - "Host 校验、暂存并发布现有 v3 image Artifact 生命周期"
    - "Desktop 复用现有 loading、preview、native save 与失败展示"
  out_of_scope:
    - "任意图片编辑、局部重绘、风格迁移、多参考图或非人物主体图生图"
    - "image-01-live、真实视频/文件/报告 producer 或其他图片 Provider"
    - "公网部署、SLA、多租户、云资源与 production_hardened 加固"
    - "性能专项、完整回归矩阵、S10D-H harness 修复或关闭"
  main_flow:
    - "用户运行 canonical demo_fast 启动命令；Desktop 自动绑定固定本地 identity/tenant/capabilities，无登录交互并直达 /chat。"
    - "用户输入明确的文生图请求，或附带一张人物图片并明确要求参考人物生成新图。"
    - "MiniMax-M3 仅在明确生图意图下调用 generate_image；普通对话和看图分析继续返回文本。"
    - "Agent Host 固定调用中国区 image-01，校验响应后发布 v3 Artifact started/progress/completed 事件。"
    - "Desktop 在当前消息内显示生成状态；ready 后展示图片，并允许预览和原生保存。"
    - "Provider 或校验失败时展示安全错误与重新提交建议，不发布伪 ready，也不自动产生第二次付费调用。"
  visual_direction: "复用现有 ChatArtifactShell 与图片 lightbox；在原消息内保持稳定卡片、清晰阶段、低干扰恢复提示，不新增第二套视觉语言。"
  ui_states:
    idle: "尚未调用生图工具时只显示正常文本流，不提前创建空图片卡片。"
    loading: "收到 started/progress 后在对应 assistant 消息中显示稳定图片占位、阶段文案与进度。"
    success: "ready 图片在消息中直接显示，可进入 lightbox 预览并通过 native dialog 保存。"
    empty: "模型未调用工具或没有可用 Artifact 时保持普通文本结果，不显示破损媒体占位。"
    error: "失败卡片只显示脱敏 failureCode 对应的用户提示，不显示 Key、请求体、base64 或 provider raw error。"
    retry: "提示用户在输入框重新提交或调整请求；系统不对未知付费结果自动重试。"
    cancel: "用户停止当前轮后取消未完成请求，Artifact 保持明确取消/失败终态且不污染下一轮。"

must_acceptance:
  - id: "AC-IMG-001"
    statement: "明确文生图请求可由 MiniMax-M3 调用 generate_image，并在同一消息获得 image-01 返回的真实图片。"
    verification: "真实本地 Desktop fresh run，记录一次 T2I Artifact、预览与 content-free 调用证据。"
    status: "pass"
  - id: "AC-IMG-002"
    statement: "当前轮附带单张 PNG/JPEG 人物图片并明确要求参考人物生图时，Host 使用 subject_reference.character 生成真实新图。"
    verification: "真实本地 Desktop fresh run，记录一次人物参考 I2I Artifact；确认不是回显附件。"
    status: "pass"
  - id: "AC-IMG-003"
    statement: "普通文本对话和仅要求分析图片时不调用 generate_image，也不产生图片 Artifact 或付费调用。"
    verification: "分别执行普通文本与看图分析，检查消息、Host 事件及付费调用计数。"
    status: "pass"
  - id: "AC-IMG-004"
    statement: "生成中、成功、失败、重试建议和取消均在当前消息内有清晰且不会卡死的状态。"
    verification: "组件 focused tests 加真实 happy path 与一个代表性失败/取消 smoke。"
    status: "pass"
  - id: "AC-IMG-005"
    statement: "真实 ready 图片可在 Desktop 内预览，并可通过既有 native save 保存到用户选择的位置。"
    verification: "真实 Tauri 会话中打开预览并保存后，核对目标图片可解码且不是 synthetic fixture。"
    status: "pass"
  - id: "AC-IMG-006"
    statement: "Key 仅通过 owner-only 文件传给 Host；日志、事件、DOM 和错误中不出现 Key、Data URL 或生成图片 base64。"
    verification: "focused security tests、失败路径和脱敏日志检查。"
    status: "pass"
  - id: "AC-IMG-007"
    statement: "HTTP、业务状态、超限或畸形图片失败时 fail closed，不发布伪 ready 且不盲目自动重试付费请求。"
    verification: "fake provider focused tests与一次不付费的代表性错误 smoke。"
    status: "pass"
  - id: "AC-IMG-008"
    statement: "从 clean process 启动 local demo_fast 后，无登录页、浏览器或账号密码输入，Desktop 自动启动 Host/Runtime 并直达 /chat；非 local/demo_fast 时原认证路径不变。"
    verification: "记录 canonical launcher 进程链、同 profile latest debug app 的 fresh/Settings 重启首屏与 DOM、Host readiness/退出生命周期，以及 exact profile 负向 focused 回归。"
    status: "pass"

