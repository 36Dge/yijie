product_ux:
  status: PASS
  primary_user: 易界本机普通聊天及已有连接器用户
  problem: 原生检索已存在但两模型关闭；Kimi专用wire不支持，必须最小适配并保留原生机制
  user_outcome: Kimi按需检索当前有效工具定义，经已有exec和审批完成原业务任务
  in_scope:
    - 原生BM25与缓存和当前有效MCP目录复用
    - 同名tool_search的标准function薄适配及原生Code Mode后续调用
    - 首批Kimi普通根聊天资格与配对启用，旧路径兼容
    - 权限取消历史记忆标记和原六组工具定向回归
  out_of_scope:
    - 未经任务级额度授权的供应商调用
    - 未经独立资格启用MiniMax或新增模型
    - 全市场搜索及自动安装启用选择连接器
    - 自建索引目录加载器执行引擎或审批机制
    - 专属搜索UI、新公共事件、数据库迁移和其它工具启用
    - 提交推送签名公开或生产发布
  main_flow:
    - 原开发入口进入已有聊天并使用当前有效连接器选集
    - 原生根据有效Deferred工具声明适配后的tool_search
    - 模型搜索，原生BM25返回匹配定义与原生exec调用指引
    - 模型通过既有exec调用原工具，仍走当前权限与审批
    - 返回真实工具结果和最终答复，正常保存可读历史
  visual_direction: 无新增控件或页面，沿用真实整轮进度和实际MCP活动审批结果；不伪造搜索Item
  ui_states:
    idle: 原聊天输入区，无搜索按钮或无目录空卡
    loading: 原整轮进行中；无原生事件不合成检索进度
    success: 真正业务工具完成及最终答复，命中不是业务成功
    empty: 无目录不暴露；无命中如实返回空集合，不自动安装授权
    error: 原生参数或协议失败如实呈现；超限不回传截断伪JSON
    retry: 保留已有重试策略；未知业务结果不重发，只允许显式新意图
    cancel: 原生中断CodeMode取消Gateway撤销和正常退出，不强杀

