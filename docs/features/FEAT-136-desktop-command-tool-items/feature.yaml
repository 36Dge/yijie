schema_version: 3
delivery_profile: "demo_fast"
exposure: "local"

feature:
  id: "FEAT-136"
  slug: "desktop-command-tool-items"
  title: "Desktop Command 与 Tool 执行 Item"
  status: "active"
  created_at: "2026-08-29"
  requirement_owner: "段成威"
  technical_owner: "段成威"
  reviewer: "段成威"
  release_owner: "段成威"

scope:
  risk_level: "high"
  data_classification: "restricted"
  contract_impact: "semantic"
  database_change: "expand"
  persistence_change: "durable"
  runtime_change: "none"
  auth_permission_change: "none"
  user_workflow_change: "user_visible"
  ui_change: "interactive"
  ai_behavior_change: "none"

repositories:
  - "yijie"
  - "yijie-contracts"
  - "yijie-agent-host"
  - "yijie-desktop"

timebox:
  target_hours: 12
  hard_stop_hours: 16
  no_progress_minutes: 30
  same_blocker_minutes: 90
  non_core_limit_minutes: 120
  core_blocker_minutes: 240

product_ux:
  status: "PASS"
  primary_user: "在易界 AI Desktop 中需要理解 Agent 正在执行什么、看到安全的 Command 输出与 Tool 进度，并准确判断成功、失败或拒绝结果的本地用户"
  problem: "固定 Runtime 已有 CommandExecution 与 McpToolCall 生命周期，但当前 Host/Desktop 只保留泛化 Item 类型，丢失安全摘要、输出、进度、状态、耗时和错误；用户只能看到笼统处理中，也无法保证实时事件与历史 hydration 的结构一致。"
  user_outcome: "后续 Host 和 Desktop 按同一 v5 权威契约展示 Command 的真实 started、output delta、completed/failed/declined，以及通用 Tool 的 started、progress、completed/failed 安全投影；事件可重放、可有界持久化且不泄露 raw Runtime、绝对路径、参数、结果或秘密。本批只完成 D0 与 Contracts，整体 Feature 继续进行中。"
  in_scope:
    - "引用 FEAT-131 CAP-016、CAP-017 与 GS-003、GS-004，Command 是本 Feature 的 Must"
    - "新增显式协商的 AgentSessionEventV5，保留 v1 至 v4 schema、proto、route 和 consumer 语义"
    - "冻结 session/thread/turn/item/event 身份、Command 与 Tool lifecycle、event_id replay/dedupe、Item 与 Turn 终态边界"
    - "冻结安全 allowlist、UTF-8 caps、compact JSON SSE 计数、先脱敏后计数、显式截断及 Command complete/head-tail/unavailable 保留策略"
    - "冻结结构化 workspace-relative/redacted cwd（总量包含分隔符）、Tool metadata-only arguments/progress/result summary、fixed unknown identity 与 stable error code"
    - "用无敏感正文的合成 fixture 验证 Contracts shape、重复 event identity、合法重复文本、截断、unknown 与 completed reconciliation"
    - "在本批形成 yijie-contracts 的 source/generated 不可变本地 commit，并把完整 SHA 回填本包"
  out_of_scope:
    - "本批不修改 yijie-agent-host、yijie-desktop 或 yijie-codex，也不创建 Host/Desktop 实现分支"
    - "不执行 Host Runtime notification mapping、Desktop reducer、SQLCipher migration、hydration 或 UI"
    - "不启动 Provider、模型或真实 Command/Tool vertical，不执行 D4"
    - "不注册新 MCP server、Connector、dynamic tool 或真实 Tool producer，不开启 experimentalApi"
    - "不增加 Command approval reverse request、decision、expiry、waiting action、sandbox、network、filesystem、shell 或 Tauri 权限；FEAT-137 保持未实施"
    - "不增加 FileChange、Diff、patch、file approval、write gate 或相关 fixture/UI/D4；FEAT-138 保持 Cancelled / owner-excluded"
    - "不把 FEAT-128 Artifact 合并或包装为 Command、Tool、FileChange 或 Diff"
    - "不透传 raw command、canonical cwd、process id、command actions、MCP arguments/result/content/structured content/meta、plugin/app context、token、secret 或 Runtime wire"
    - "不修改、升级、重编译、替换、同步或重新固定 Runtime；固定 experimentalApi=false"
    - "不 push、merge、tag、publish、release 或 deploy"
  main_flow:
    - "Contracts 先从固定 Runtime stable CommandExecution、outputDelta、McpToolCall 与 progress 事实建立 v5 安全投影；旧版本保持原样。"
    - "未来 Host 按真实 event_id、turn_id 和 item_id 映射、脱敏、计数与截断；同文本的不同 event_id 必须保留，同 event_id replay 只消费一次。"
    - "未来 Desktop reducer 按 item identity 聚合 Command delta 和 Tool progress，并以 item.completed 的 bounded snapshot 封口 Item；普通 error 不封口 Turn。"
    - "未来 Desktop 仅持久化身份、kind/status、安全摘要、caps/truncation、duration/exit/error 和终态元数据，重开后只 hydrate 一份权威 Item。"
    - "本批在 Contracts commit 与治理证据回填后停止；Host 到 Desktop 的真实链路在下一批单独执行。"
  visual_direction: "继承 FEAT-131 的 Codex-inspired approximation 与 Yijie Design System；未来 Command/Tool Item 以状态、摘要和结果为主，输出可折叠、可安全复制，错误和截断不只依赖颜色。本批无 UI 变更，视觉验收保持 NOT RUN。"
  ui_states:
    idle: "没有 active Command/Tool 时不显示伪造 Item 或状态；历史只读取已经持久化的权威安全投影。"
    loading: "started 到达后显示真实 running/in_progress；没有 delta/progress 时不伪造百分比、耗时或输出。"
    success: "item.completed 的 completed 状态封口对应 Item，显示 bounded 结果、duration 和适用 exit code；Turn 仍等待 turn.completed。"
    empty: "Command aggregate 不可用时消费显式 unavailable，不显示伪造空输出；Tool 无安全摘要时不从 raw payload 补造正文。"
    error: "failed、declined、unknown、redaction 或 limit 只显示闭合 stable code 与安全摘要；普通 error 不自行结束 Turn。"
    retry: "本 Feature 不自动重放 Command/Tool；后续只接受上层明确的新 Turn/重试意图并生成新 identity。"
    cancel: "本批不新增取消或审批动作；后续中断只服从真实 Item/Turn authority，不通过强杀或故障注入制造结果。"

must_acceptance:
  - id: "AC-001"
    statement: "Command 真实经历 started、零到多个 output delta、completed，并准确区分 running、completed、failed、declined、exit code 与 duration；普通 error 不自行终止 Turn。"
    verification: "v5 Contracts conformance 提供 partial evidence；下一批 Host/Desktop mapper、reducer 和真实安全只读 Command vertical 完成最终验收。"
    status: "pending"
  - id: "AC-002"
    statement: "SSE/replay 只按 event_id 去重；同一 item 连续出现内容完全相同但 event_id 不同的 output chunk 时，两段都被保留，且 stream/sequence gap 进入保守恢复。"
    verification: "Contracts reducer model test、下一批 Host replay 与 Desktop reducer conformance。"
    status: "pending"
  - id: "AC-003"
    statement: "item.completed 是对应 Command/Tool 的权威封口和 bounded snapshot；它与累计 delta/progress 对账后不重复、不串 item、不回滚，late delta 不改变已封口 Item。"
    verification: "Contracts reconciliation test与下一批 Desktop persistence/hydration tests。"
    status: "pending"
  - id: "AC-004"
    statement: "Command 只包含安全 display summary、结构化 workspace-relative/redacted cwd、bounded output、truncated/reason、duration、exit code 与 stable error；不含 raw Runtime、绝对路径或秘密。"
    verification: "v5 schema allowlist/caps/negative-field audit与下一批 Host redaction conformance。"
    status: "pending"
  - id: "AC-005"
    statement: "通用 MCP Tool contract 表达 started、progress、completed/failed 及预留 declined，且只暴露安全 server/tool identity、metadata-only arguments/progress/result summary、duration、stable error 和 truncation；不新增 Tool producer。"
    verification: "v5 Contracts fixtures与 Runtime shape test；真实 GS-004 保持 BLOCKED/NOT RUN，直到存在 Owner 批准的 stable producer。"
    status: "pending"
  - id: "AC-006"
    statement: "unknown Tool 使用固定 unknown identity 与安全摘要继续处理；未知 v5 event/variant fail closed 并请求 resync，不导致旧 consumer 崩溃或 raw fallback。"
    verification: "Contracts unknown identity/event tests与下一批 Desktop parser fail-soft/closed tests。"
    status: "pending"
  - id: "AC-007"
    statement: "未来 persistence/hydration 至少保留 task、session、thread、turn、item、event/stream/sequence identity，item kind/status、安全摘要、caps/truncation、duration/exit/error 和 completed authority，重开后只出现一次。"
    verification: "Contracts completed snapshot shape与下一批 SQLCipher migration/hydration tests。"
    status: "pending"
  - id: "AC-008"
    statement: "未来 Command/Tool UI 在 light/dark、1180×760、200% 缩放和键盘下可读、可折叠且只复制安全内容，不造成主体布局溢出。"
    verification: "下一批 Desktop component、visual、accessibility 与 canonical local smoke；本批 NOT RUN。"
    status: "pending"

contract:
  impact: "semantic"
  authority: "固定 yijie-codex 0.144.6 stable canonical schema 是外部事实；yijie-contracts@3c3000a6fbe2f08ab2131a463a1691e867d661b1 的显式协商 AgentSessionEventV5 是 Yijie JSON/SSE semantic validity authority，AsyncAPI v5 与 Agent Host v5 OpenAPI 引用该权威，Protobuf v5 仅是 typed transport 且必须经过 JSON-equivalent semantic gate；未来 yijie-agent-host 是唯一 Runtime mapper，FEAT-132 ConversationState 与 Desktop SQLCipher 分别是 UI 状态和已观察历史 authority。"
  source_first_plan: "已保持 v1 至 v4 不变，在独立 v5 route/schema 中增加 Command lifecycle/output 与 MCP Tool lifecycle/progress 的安全闭合投影，锁定 caps、redaction policy、closed generic allowlist、unknown、dedupe 和 terminal 语义；以不触发预存攻击 fixture 的定向 generation、重复生成 digest、lint、非 archive Node tests、Go tests、direct TypeScript build、双基线 breaking checks及人工 semantic/security review形成不可变 Contracts commit 3c3000a6fbe2f08ab2131a463a1691e867d661b1。下一批 Host/Desktop 必须固定该完整 SHA 后才能实现或启用。"
  status: "PASS"
  checks:
    - repository: "yijie-contracts"
      command: "scoped Buf + Agent Host OpenAPI Go/TS + AsyncAPI + v5 JSON Schema generation; repeat and compare seven generated/protected SHA-256 values"
      status: "PASS"
      exit_code: 0
      result: "两轮定向生成全部 exit 0；HASH_MATCH=true；未触发预存 archive attack fixture"
    - repository: "yijie-contracts"
      command: "make lint"
      status: "PASS"
      exit_code: 0
      result: "全部 OpenAPI/AsyncAPI valid；15 JSON Schemas、Buf lint、TypeScript no-emit、Go vet PASS"
    - repository: "yijie-contracts"
      command: "all Node tests except tests/skill-bundle-v1.test.mjs; go test ./...; pnpm exec tsc -p tsconfig.json"
      status: "PASS"
      exit_code: 0
      result: "安全 Node suite 63/63；Go 全量 PASS；TypeScript direct build PASS"
    - repository: "yijie-contracts"
      command: "pnpm check:v1-wire f16a497e1377f45747f8ff9292b4b60cf2027f88"
      status: "PASS"
      exit_code: 0
      result: "Public v1 2 paths 与 Agent Host v1 7 paths/reference closure 完全相等"
    - repository: "yijie-contracts"
      command: "./scripts/check-breaking.sh 3832a6c5e99b2a6365f193280fdb887c8fdbc2de"
      status: "PASS"
      exit_code: 0
      result: "对 FEAT-134 candidate 无 OpenAPI、Protobuf、AsyncAPI 或 JSON Schema breaking change"
    - repository: "yijie-contracts"
      command: "./scripts/check-breaking.sh f16a497e1377f45747f8ff9292b4b60cf2027f88"
      status: "PASS"
      exit_code: 0
      result: "对 published supported baseline 无 OpenAPI、Protobuf、AsyncAPI 或 JSON Schema breaking change"
    - repository: "yijie-contracts"
      command: "git diff --check; protected/generated/source digest review; independent semantic reviews"
      status: "PASS"
      exit_code: 0
