  hard_stop_hours: 16
  no_progress_minutes: 30
  same_blocker_minutes: 90
  non_core_limit_minutes: 120
  core_blocker_minutes: 240

product_ux:
  status: "PASS"
  primary_user: "在易界 AI Desktop 中需要理解 Agent 正在执行什么、看到安全 Command 输出与 Tool 进度，并准确判断成功、失败或拒绝结果的本地用户。"
  problem: "Host/Desktop 起点只保留泛化 Item，丢失 Command/Tool 的安全摘要、输出、进度、状态、耗时和错误，也无法保证实时事件与 SQLCipher hydration 的结构一致。"
  user_outcome: "Owner-authorized Runtime producer repair、final repin 与 fresh Command tranche 已完成；真实 completed/failed 各一条并在正常重开后各 hydrate 一次。fresh 请求 1/5 且无重试。Tool D4 继续 BLOCKED/NOT RUN，因此 Feature active、overall verification FAIL。"
  in_scope:
    - "引用 CAP-016/CAP-017 与 GS-003/GS-004；Command 是当前真实验收目标。"
    - "使用显式协商 AgentSessionEventV5，保持 v1 至 v4 schema、proto、route 与 consumer 语义。"
    - "冻结 Command/Tool lifecycle、event-ID replay/dedupe、completed reconciliation、caps、redaction、unknown 与 persistence/hydration。"
    - "Host 实现 v5 mapper/replay/reconciliation；Desktop 实现 closed decoder、reducer、SQLCipher 与 Command/Tool UI。"
    - "Owner 授权 Runtime producer source patch，使 early sandbox-denial 发布 canonical started 与 failed terminal。"
    - "修复 canonical runner、stable artifact 与 sidecar gates，并完成 final cross-pin 和独立复审。"
    - "在隔离无敏感 Git repo 中执行 fresh Command tranche，最多 5 次真实请求，实际使用 1 次。"
  out_of_scope:
    - "Tool D4 保持 BLOCKED/NOT RUN；不注册 MCP server、Connector、dynamic tool 或制造 Tool producer。"
    - "不增加 Command approval、FileChange、Diff、patch、file approval、写 gate 或 FEAT-138。"
    - "不透传 raw command、绝对路径、秘密、process identity、MCP raw payload 或 Runtime wire。"
    - "不扩大 experimentalApi、sandbox、approvalPolicy、network、filesystem、shell 或 Tauri 权限。"
    - "不强杀、故障注入、破坏权限、替换 binary 或使用攻击 fixture。"
    - "不 amend、push、tag、merge、publish、release 或 deploy。"
  main_flow:
    - "canonical local/demo_fast stable runner 开启 FEAT-134/136 gates，保持 experimentalApi=false、sandbox=read-only、approvalPolicy=never。"
    - "Runtime 发布 canonical Command lifecycle；Owner repair 使 early denial 也先 started 后 failed terminal。"
    - "Host 以真实 identity 映射、脱敏、计数和截断；Desktop closed decoder/reducer 聚合并以 completed snapshot 封口。"
    - "Desktop 只持久化安全投影与 authority metadata；正常重开后按稳定 identity hydrate，不重复、不回滚。"
    - "Tool 只保留通用 source conformance，等待真实 producer 与 Owner 决策后另行执行 Tool D4。"
  visual_direction: "继承 Yijie Design System；Command/Tool Item 以状态、摘要和结果为主，输出可折叠、可安全复制，错误与截断不只依赖颜色。fresh Command live 已覆盖 light、键盘、状态文字/图标、aria-live 与 200%；dark 和精确 1180×760 live 未执行。"
  ui_states:
    idle: "没有 active Command/Tool 时不显示伪造 Item；历史只读取已持久化的权威安全投影。"
    loading: "started 到达后显示真实 running/in_progress；没有 delta/progress 时不伪造百分比或输出。"
    success: "item.completed 封口对应 Item，显示 bounded 结果、duration 和适用 exit code；Turn 仍等待 turn.completed。"
    empty: "Command aggregate 不可用时使用显式 unavailable；Tool 无安全摘要时不从 raw payload 补造正文。"
    error: "failed、declined、unknown、redaction 或 limit 只显示闭合 stable code 与安全摘要；普通 error 不自行结束 Turn。"
    retry: "本 Feature 不自动重放 Command/Tool；只有上层明确新意图才生成新 identity。"
    cancel: "本批不新增取消或审批；只服从真实 Item/Turn authority，不通过强杀或故障注入制造结果。"

must_acceptance:
  - id: "AC-001"
    statement: "Command 真实经历 started、零到多个 output delta、completed，并准确区分 running、completed、failed、declined、exit code 与 duration；普通 error 不自行终止 Turn。"
    verification: "Fresh real tranche 得到 completed 与 failed、exit code、duration、stable error；started/delta 协议的 Runtime/Host/Desktop focused tests PASS。执行过快，Item started 与独立 output-delta live 未观察。"
    status: "pending"
  - id: "AC-002"
    statement: "SSE/replay 只按 event_id 去重；相同文本但 event_id 不同的 output chunk 都保留，stream/sequence gap 进入保守恢复。"
    verification: "Contracts/Host/Desktop event-ID 与 gap focused conformance PASS；natural replay NOT OBSERVED，未注入或伪造。"
    status: "pending"
  - id: "AC-003"
    statement: "item.completed 是对应 Command/Tool 的权威 bounded snapshot；对账后不重复、不串 item、不回滚，late delta 不改变已封口 Item。"
    verification: "Reconciliation/late-event focused tests PASS；real normal reopen 后两个 terminal Item 各一次且无回滚；真实 event-ID/late event 未独立观察。"
    status: "pending"
  - id: "AC-004"
    statement: "Command 只包含安全 display summary、结构化 workspace-relative/redacted cwd、bounded output、truncated/reason、duration、exit code 与 stable error；不含 raw Runtime、绝对路径或秘密。"
    verification: "Fresh completed/failed Item、stable command_failed 与安全复制 PASS；clipboard 和证据无 raw command、绝对路径、秘密或 Runtime wire。"
    status: "pass"
  - id: "AC-005"
    statement: "通用 MCP Tool contract 表达 started、progress、completed/failed 及预留 declined，且只暴露安全 metadata；不新增 Tool producer。"
    verification: "Contracts/Host/Desktop generic Tool source conformance PASS；真实 producer 不存在，Tool D4 BLOCKED/NOT RUN。"
    status: "pending"
  - id: "AC-006"
    statement: "unknown Tool 使用固定 unknown identity 与安全摘要；未知 v5 event/variant fail closed 并请求 resync，不导致旧 consumer 崩溃或 raw fallback。"
    verification: "Unknown identity、closed parser 与 resync focused tests PASS；真实 unknown/recovery vertical NOT RUN。"
    status: "pending"
  - id: "AC-007"
    statement: "persistence/hydration 保留最小身份、安全摘要、caps/truncation、duration/exit/error 与 completed authority，重开后只出现一次。"
    verification: "SQLCipher v10、mixed history 与 fresh real normal reopen PASS；completed 1、failed 1，各出现一次。"
    status: "pass"
  - id: "AC-008"
    statement: "Command/Tool UI 在 light/dark、1180×760、200% 缩放和键盘下可读、可折叠且只复制安全内容，不造成主体布局溢出。"
    verification: "Command live light、键盘、状态文字/图标、aria-live、安全复制与 200% PASS；dark、精确 1180×760 live 与 real Tool UI 未完成。"
    status: "pending"

