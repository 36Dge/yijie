feature:
  id: FEAT-136
  slug: desktop-command-tool-items
  title: 基于 Codex 原生事实的 Command 执行 Item（Tool 后移）
  status: usable
  created_at: 2026-08-29
  requirement_owner: 段成威
  technical_owner: 段成威
  reviewer: 段成威
  release_owner: 段成威
scope:
  risk_level: high
  data_classification: restricted
  contract_impact: none
  database_change: none
  persistence_change: none
  runtime_change: none
  auth_permission_change: none
  user_workflow_change: user_visible
  ui_change: interactive
  ai_behavior_change: none
repositories:
  - yijie
  - yijie-desktop
timebox:
  target_hours: 12
  hard_stop_hours: 16
  no_progress_minutes: 30
  same_blocker_minutes: 90
  non_core_limit_minutes: 120
  core_blocker_minutes: 240
product_ux:
  status: PASS
  primary_user: 需要准确理解 Command 执行结果、安全输出及历史缺失的本地用户。
  problem: FEAT-132 已提供原生机制，但 Command 适配仍伪填旧 DTO，丢弃安全目录、误报截断与历史忙碌，旧 D4 不能证明当前 native 展示。
  user_outcome: 复用 Codex 原生 Item 和既有 Native 缓冲/SQLCipher，以真实字段呈现执行结果、已有安全输出及信息缺失；保持旧历史只读。
  in_scope:
    - 原生 Command 与旧档案的进程内展示类型分开；不伪填 startedSource、cwd 结构或 retention。
    - 直接使用安全 cwdLabel、outputText、status、exitCode、durationMs；0 值与合法空内容保留。
    - 执行结果、Item availability 与 UI busy 分开，Turn 结束不封口 Item。
    - failed/declined 使用显式原生 status 的稳定产品文案/代码映射，不猜 Runtime 错误。
    - 沿用最终安全输出和既有复制行为；会话诊断不猜 Item 归属。
    - 定向回归、日常 canonical 既有数据与正常退出重启，重建当前验收记录。
  out_of_scope:
    - 不修改 Codex Runtime、Host 协议、安全投影、private IPC、数据库 schema 或 migration。
    - 不恢复 v5 流式输出、第二累积器、正文对账、身份猜测、历史重建或自动封口。
    - 不恢复 FEAT-137、不改变 FEAT-152 权限；Tool 仍由 FEAT-144 承接，blocked / NOT RUN。
    - 完整 live started/output-delta 顺序、dark、精确 1180×760 保留原 FEAT-143 后移范围，不冒充 PASS。
    - replay/late-event/unknown vertical 的原 FEAT-142 后移范围不自动纳入新验收。
    - 不转用历史模型预算、不强杀、不攻击或故障注入、不复制用户数据库或凭据。
  main_flow:
    - 从日常 canonical pnpm tauri:demo-fast:app 正常启动，使用现有 app-data 与 Host Home。
    - 新对话仍走 native v7、唯一 NativeDisplayBuffer 和 SQLCipher；Vue 读取完整原生显示对象。
    - Command 直接展示原生 status、安全标签、输出及 exit/duration；最终 Item 直接替换。
    - 缺结束记录时保留最后观察事实，关闭 busy 并明确提示；不根据 Turn 结果生成 Item 终态。
    - 用户展开并安全复制；旧历史只读；正常切换、退出、重启后保持来源和语义。
  visual_direction: 沿用 ChatTimelineItemShell、现有 token、纯文本、安全复制、可聚焦 disclosure 和独立状态播报；不增加布局或依赖。
  ui_states:
    idle: 历史可读，不冒称旧 running 为当前正在执行。
    loading: 只有既有可信 live policy 允许时显示 busy；输出等待结束记录。
    success: 按原生结果显示安全输出；不把非零 exit 自行改为 failed。
    empty: 区分合法空输出、未提供输出和未观察到结束记录。
    error: failed/declined 显式状态与可用性分开；未知原因不伪造。
    retry: 只使用既有业务意图入口，不重放命令、猜接管或补发。
    cancel: 原生 Turn 中断保留，Item 状态不改写；不新增取消或审批行为。
must_acceptance:
  - id: AC-001
    statement: 原生 Command ID/status/exitCode/durationMs 按事实展示，0 值保留；failed/declined 只映射安全产品文案，不改原生结果。
    verification: 原生 Command→selector→组件测试及真实成功/失败（exit 0/128，duration 0ms）；详见 02-verification.md。
    status: PASS
  - id: AC-002
    statement: 完整 Item 直接替换，接受更短、不同、合法空输出及未先观察到 started 的 completed；无对账或第二累计。
    verification: 最终值更短/不同/空内容及未见 started 直接 completed 定向测试，无重复卡片；详见 02-verification.md。
    status: PASS
  - id: AC-003
    statement: Turn 结束、历史或连接不可确认时停止错误 busy/正在执行播报，保留 Item 原始状态及缺结束记录。
    verification: 完成/失败/中断/历史/stream gap 定向检查，真实终态后无错误 busy；详见 02-verification.md。
    status: PASS
  - id: AC-004
    statement: 安全 cwdLabel 不丢失；null/空输出/Item partial 分开，未知截断原因不伪造，失败空输出不说成成功。
    verification: 原生目录标签、null/空/partial 定向检查；真实两条命令安全字段可读；详见 02-verification.md。
    status: PASS
  - id: AC-005
    statement: 只展示及复制既有安全输出，不重新启用原始 delta；诊断不猜 Item 归属或永久暗示等待。
    verification: 纯文本及复制回归；真实指针/键盘复制成功；会话诊断历史观察文案；详见 02-verification.md。
    status: PASS
  - id: AC-006
    statement: SQLCipher 原生事实正常重开保持来源、身份及终态；冷历史不覆盖已观察内容，旧 Command 档案只读可访问。
    verification: SQLCipher Command 正常 reopen/cold conflict、旧 IPC/卡片兼容；真实重开同一两条 Command，原 8 条映射不变；详见 02-verification.md。
    status: PASS
  - id: AC-007
    statement: 原生适配与组件联合回归通过；日常 canonical 切换/退出重启、light/键盘/aria-live/200%、附件/Artifact/Composer/FEAT-152 无定向回归。
    verification: 251 项前端+10 项 App/zoom；标准构建和最终代码的真实 Command、权限/附件/Artifact/正常重启；200% 裁切已修复复查；详见 02-verification.md。
    status: PASS
  - id: AC-008
    statement: 无新 reducer、生命周期推演、历史重建或累积器；删除有引用审计，保留兼容有理由，Tool 与历史豁免如实记录。
    verification: 与实现阶段分离的自审、删除/保留清单；没有修改 Runtime/Host/schema/权限或增加引擎；详见 02-verification.md。
    status: PASS
