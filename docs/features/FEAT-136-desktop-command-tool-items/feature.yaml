product_ux:
  status: "PASS"
  primary_user: "在易界 AI Desktop 中需要理解 Agent 只读 Command 执行结果并安全复制输出的本地用户。"
  problem: "泛化 Item 无法稳定表达 Command 的终态、耗时、退出信息、安全输出与正常重开后的历史。"
  user_outcome: "在 canonical local/demo_fast 入口中，真实 completed 与代表性 failed Command 各形成且只形成一个安全 Item；正常关闭重开后 SQLCipher 各恢复一次，并通过核心无障碍与 200% 验证。"
  in_scope:
    - "CAP-016 / GS-003 的真实 Command completed/failed terminal、cardinality、exit code、duration 与 stable error。"
    - "Command 闭合安全投影、bounded output、redaction 与安全复制。"
    - "Command SQLCipher persistence/hydration；正常重开后每个 terminal Item 只出现一次。"
    - "Command light、键盘折叠、状态文字/图标、aria-live 与 200% 核心 UI。"
    - "Owner 授权的 Runtime early sandbox-denial producer source repair及最终 cross-pin/stable artifact 冻结。"
    - "保留 producer-neutral Tool contract/consumer 基础，但不把它声明为本 Feature 的产品交付或 Must。"
  out_of_scope:
    - "真实 Tool producer、产品入口、安全边界与 Tool D4；全部由 FEAT-144 承接。"
    - "natural replay、live event_id、late event、unknown/resync；由 FEAT-142 承接。"
    - "dark、精确 1180×760 与完整 started/output-delta 集成状态顺序；由 FEAT-143 承接。"
    - "declined/approval reverse request；由 FEAT-137 承接。"
    - "FileChange、Diff、审批、写权限与 FEAT-138。"
    - "强杀、故障注入、权限破坏、binary 替换、攻击 fixture、发布与生产写。"
  main_flow:
    - "canonical local/demo_fast stable runner 在 read-only/never 与 FEAT-134/136 gates 下启动。"
    - "Runtime 发布 canonical Command terminal；Host 映射安全投影；Desktop closed decoder/reducer 展示 completed 或 failed。"
    - "用户以键盘展开、读取并复制安全内容；状态通过文字、图标与 aria-live 表达。"
    - "应用正常关闭和重开后，SQLCipher 按稳定身份恢复两个 terminal Item，各一次且不回滚。"
  visual_direction: "继承 Yijie Design System；Command Item 以状态和安全结果为主，输出可折叠、可键盘操作，错误与完成不只依赖颜色。"
  ui_states:
    idle: "没有真实 Command 时不制造 Item；历史仅来自已持久化的安全投影。"
    loading: "运行中状态只由真实 lifecycle 驱动；完整 live started/delta 顺序留给 FEAT-143。"
    success: "completed terminal 显示 bounded 结果、duration 与适用 exit code。"
    empty: "安全 aggregate 不可用时显示 unavailable，不从 raw payload 补造。"
    error: "failed 仅显示闭合 stable code 与安全摘要；普通 error 不自行结束 Turn。"
    retry: "本 Feature 不自动重放 Command；新尝试必须来自新的上层意图。"
    cancel: "本 Feature 不新增取消或审批；只服从真实 Item/Turn authority。"

must_acceptance:
  - id: "AC-001"
    statement: "真实成功 Command 形成且只形成一个 completed terminal Item，并显示 exit 0 与 duration。"
    verification: "Fresh real tranche 中 completed=1、exit 0、duration 0ms；没有重复或第三个 Command Item。"
    status: "pass"
  - id: "AC-002"
    statement: "代表性安全失败 Command 形成且只形成一个 failed terminal Item，并显示非零 exit、duration 与 stable error。"
    verification: "Fresh real tranche 中 failed=1、exit 128、duration 0ms、stable command_failed；没有重复。"
    status: "pass"
  - id: "AC-003"
    statement: "Command 仅暴露闭合安全摘要、bounded/redacted output、duration、exit 与 stable error，复制内容不含 raw Runtime、绝对路径、秘密或 wire。"
    verification: "Fresh completed/failed 投影与 clipboard 检查 PASS；保留显式 redaction 标记。"
    status: "pass"
  - id: "AC-004"
    statement: "正常关闭并重开 Desktop 后，SQLCipher 只恢复最小安全 Command 投影，每个 terminal Item 只出现一次且不回滚。"
    verification: "Canonical 正常重开后 Items=2、completed=1、failed=1；每条一次。"
    status: "pass"
  - id: "AC-005"
    statement: "Command UI 在 light 与 200% 下可读，可用键盘展开/折叠，状态以文字、图标和 aria-live 表达，且只复制安全内容。"
    verification: "Fresh live light、键盘/折叠、状态文字/图标、aria-live、安全复制与 200% 全部 PASS。"
    status: "pass"

