schema_version: 3
delivery_profile: "demo_fast"
exposure: "local"

feature:
  id: "FEAT-136"
  slug: "desktop-command-tool-items"
  title: "Desktop Command 与 Tool 执行 Item"
  status: "active"
  created_at: "2026-08-29"
  requirement_owner: "段成威"
  technical_owner: "段成威"
  reviewer: "段成威"
  release_owner: "段成威"

scope:
  risk_level: "high"
  data_classification: "restricted"
  contract_impact: "semantic"
  database_change: "expand"
  persistence_change: "durable"
  runtime_change: "none"
  auth_permission_change: "none"
  user_workflow_change: "user_visible"
  ui_change: "interactive"
  ai_behavior_change: "none"

repositories:
  - "yijie"
  - "yijie-contracts"
  - "yijie-agent-host"
  - "yijie-desktop"

timebox:
  target_hours: 12
  hard_stop_hours: 16
  no_progress_minutes: 30
  same_blocker_minutes: 90
  non_core_limit_minutes: 120
  core_blocker_minutes: 240

product_ux:
  status: "PASS"
  primary_user: "在易界 AI Desktop 中需要理解 Agent 正在执行什么、看到安全的 Command 输出与 Tool 进度，并准确判断成功、失败或拒绝结果的本地用户"
  problem: "固定 Runtime 已有 CommandExecution 与 McpToolCall 生命周期，但 FEAT-136 起点的 Host/Desktop 只保留泛化 Item 类型，丢失安全摘要、输出、进度、状态、耗时和错误；用户只能看到笼统处理中，也无法保证实时事件与历史 hydration 的结构一致。"
  user_outcome: "Host 和 Desktop 本地实现已按同一 v5 权威契约提供 Command/Tool 安全投影，canonical D4 entrypoint gate repair 和 clean 本地 commits 已完成。真实安全只读 Command D4 已执行 3/3 次：一个 success Command 的 completed 安全投影与单 Item hydration 可见，但隔离 Git repo 内两个 exit 128 结果没有 failed Command Item/stable error，因此 Command D4 FAIL；Tool D4 继续 BLOCKED/NOT RUN，整体 Feature active / in progress。"
  in_scope:
    - "引用 FEAT-131 CAP-016、CAP-017 与 GS-003、GS-004，Command 是本 Feature 的 Must"
    - "新增显式协商的 AgentSessionEventV5，保留 v1 至 v4 schema、proto、route 和 consumer 语义"
    - "冻结 session/thread/turn/item/event 身份、Command 与 Tool lifecycle、event_id replay/dedupe、Item 与 Turn 终态边界"
    - "冻结安全 allowlist、UTF-8 caps、compact JSON SSE 计数、先脱敏后计数、显式截断及 Command complete/head-tail/unavailable 保留策略"
    - "冻结结构化 workspace-relative/redacted cwd（总量包含分隔符）、Tool metadata-only arguments/progress/result summary、fixed unknown identity 与 stable error code"
    - "用无敏感正文的合成 fixture 验证 Contracts shape、重复 event identity、合法重复文本、截断、unknown 与 completed reconciliation"
    - "固定 yijie-contracts 的 source/generated 不可变本地 commit，并在 Host/Desktop 精确 pin 完整 SHA、v0.7.0、schema 与普通 fixture digest"
    - "实现 Host v5 negotiation、Command mapper/redactor/caps、generic Tool projection、event ID/replay 与 completed reconciliation"
    - "实现 Desktop v5 closed decoder、event-ID reducer、SQLCipher additive migration、mixed history hydration、Command/Tool UI 与无障碍状态"
    - "完成 Host producer 到 Desktop consumer 的 source-anchored conformance，并固化 Host/Desktop clean 本地 commits"
    - "修复 canonical runner、stable build 与 sidecar FEAT-136 gate；完成独立审查后执行 3/3 次已授权的安全只读 Command D4并如实保留 FAIL 证据"
  out_of_scope:
    - "不执行 Tool D4；真实 Command D4 仅使用两个闭合的 allowlisted 只读 Command 形式；Call 2/3 是用户在 Call 1 后明确允许的追加请求，没有自动、隐式或超额重试，3/3 额度已耗尽"
    - "不注册新 MCP server、Connector、dynamic tool 或真实 Tool producer，不开启 experimentalApi"
    - "不增加 Command approval reverse request、decision、expiry、waiting action、sandbox、network、filesystem、shell 或 Tauri 权限；FEAT-137 保持未实施"
    - "不增加 FileChange、Diff、patch、file approval、write gate 或相关 fixture/UI/D4；FEAT-138 保持 Cancelled / owner-excluded"
    - "不把 FEAT-128 Artifact 合并或包装为 Command、Tool、FileChange 或 Diff"
    - "不透传 raw command、canonical cwd、process id、command actions、MCP arguments/result/content/structured content/meta、plugin/app context、token、secret 或 Runtime wire"
    - "不修改、升级、重编译、替换、同步或重新固定 Runtime；固定 experimentalApi=false"
    - "不 push、merge、tag、publish、release 或 deploy"
  main_flow:
    - "Contracts 先从固定 Runtime stable CommandExecution、outputDelta、McpToolCall 与 progress 事实建立 v5 安全投影；旧版本保持原样。"
    - "Host 按真实 event_id、turn_id 和 item_id 映射、脱敏、计数与截断；同文本的不同 event_id 保留，同 event_id replay 只消费一次。"
    - "Desktop reducer 按 item identity 聚合 Command delta 和 Tool progress，并以 item.completed 的 bounded snapshot 封口 Item；普通 error 不封口 Turn。"
    - "Desktop 仅持久化身份、kind/status、安全摘要、caps/truncation、duration/exit/error 和终态元数据；mixed legacy/v4/v5 history 按 Turn authority hydrate，不把旧行伪装 v5。"
    - "Host 与 Desktop 使用同一 schema/11 个普通 fixture 完成 source-anchored conformance；canonical gate repair 后通过 pnpm tauri:demo-fast:stable 执行 Command D4。success 投影/hydration 局部成立，failed lifecycle 缺失而 FAIL；Tool D4 始终保持 blocked。"
  visual_direction: "继承 FEAT-131 的 Codex-inspired approximation 与 Yijie Design System；Command/Tool Item 以状态、摘要和结果为主，输出可折叠、可安全复制，错误和截断不只依赖颜色。component/a11y 自动化已实现；真实 App 的 light 与 AX 200% 局部 PASS，精确 1180×760 和 dark live NOT RUN。"
  ui_states:
    idle: "没有 active Command/Tool 时不显示伪造 Item 或状态；历史只读取已经持久化的权威安全投影。"
    loading: "started 到达后显示真实 running/in_progress；没有 delta/progress 时不伪造百分比、耗时或输出。"
    success: "item.completed 的 completed 状态封口对应 Item，显示 bounded 结果、duration 和适用 exit code；Turn 仍等待 turn.completed。"
    empty: "Command aggregate 不可用时消费显式 unavailable，不显示伪造空输出；Tool 无安全摘要时不从 raw payload 补造正文。"
    error: "failed、declined、unknown、redaction 或 limit 只显示闭合 stable code 与安全摘要；普通 error 不自行结束 Turn。"
    retry: "本 Feature 不自动重放 Command/Tool；后续只接受上层明确的新 Turn/重试意图并生成新 identity。"
    cancel: "本批不新增取消或审批动作；后续中断只服从真实 Item/Turn authority，不通过强杀或故障注入制造结果。"

must_acceptance:
  - id: "AC-001"
    statement: "Command 真实经历 started、零到多个 output delta、completed，并准确区分 running、completed、failed、declined、exit code 与 duration；普通 error 不自行终止 Turn。"
    verification: "Host mapper、Desktop reducer 与 source-anchored conformance focused PASS；真实 D4 只有 success completed Item，隔离 Git repo 内两个 exit 128 结果均无 failed Item，started/delta 未直接观察。"
    status: "fail"
  - id: "AC-002"
    statement: "SSE/replay 只按 event_id 去重；同一 item 连续出现内容完全相同但 event_id 不同的 output chunk 时，两段都被保留，且 stream/sequence gap 进入保守恢复。"
    verification: "Contracts model、Host replay 与 Desktop event-ID reducer focused conformance；真实 event_id 未独立观察，normal replay NOT OBSERVED。"
    status: "pending"
  - id: "AC-003"
    statement: "item.completed 是对应 Command/Tool 的权威封口和 bounded snapshot；它与累计 delta/progress 对账后不重复、不串 item、不回滚，late delta 不改变已封口 Item。"
    verification: "Host completed reconciliation、Desktop reducer、SQLCipher persistence/hydration 与 mixed authority tests PASS；真实重开证明 success Item 恰好一份，Host closed metadata 证明 session 终态 reconciliation/无 active turn，但无 Command event journal，late event 未独立观察。"
    status: "pending"
  - id: "AC-004"
    statement: "Command 只包含安全 display summary、结构化 workspace-relative/redacted cwd、bounded output、truncated/reason、duration、exit code 与 stable error；不含 raw Runtime、绝对路径或秘密。"
    verification: "v5 schema allowlist/caps、Host redaction/caps 与 Desktop closed decoder/component copy tests PASS；真实 success Item 的 safe cwd/脱敏输出可见，但隔离 Git repo 内两个失败结果无 stable error；用户消息本身显示 allowlist 文本，whole-WebView no-raw 字面标准不满足。"
    status: "fail"
  - id: "AC-005"
    statement: "通用 MCP Tool contract 表达 started、progress、completed/failed 及预留 declined，且只暴露安全 server/tool identity、metadata-only arguments/progress/result summary、duration、stable error 和 truncation；不新增 Tool producer。"
    verification: "v5 Contracts fixtures与 Runtime shape test；真实 GS-004 保持 BLOCKED/NOT RUN，直到存在 Owner 批准的 stable producer。"
    status: "pending"
  - id: "AC-006"
    statement: "unknown Tool 使用固定 unknown identity 与安全摘要继续处理；未知 v5 event/variant fail closed 并请求 resync，不导致旧 consumer 崩溃或 raw fallback。"
    verification: "Contracts/Host unknown identity 与 Desktop parser fail-soft/closed/resync focused tests。"
    status: "pending"
  - id: "AC-007"
    statement: "persistence/hydration 至少保留 task、session、thread、turn、item、event/stream/sequence identity，item kind/status、安全摘要、caps/truncation、duration/exit/error 和 completed authority，重开后只出现一次。"
    verification: "Contracts completed snapshot、SQLCipher v10 additive migration、mixed legacy/v4/v5 history 与 hydration tests PASS；真实正常重开后 success Item 恰好一次，但 failed Item 从未产生。"
    status: "pending"
  - id: "AC-008"
    statement: "Command/Tool UI 在 light/dark、1180×760、200% 缩放和键盘下可读、可折叠且只复制安全内容，不造成主体布局溢出。"
    verification: "Desktop component/accessibility focused tests PASS；真实 success Item 的折叠/键盘/状态文字/AX announcement/安全复制及 light/AX 200% 局部 PASS；状态图标仅 component 证据，精确 1180×760 与 dark live NOT RUN。"
    status: "pending"

