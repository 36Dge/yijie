  real_entrypoint: "cd ../yijie-desktop && pnpm tauri:dev"
  mock_only: false

verification:
  status: "NOT RUN"
  verified_at: "NOT RUN"
  startup:
    status: "NOT RUN"
    command_or_steps: "在 yijie-desktop 执行 pnpm tauri:dev，等待 Tauri、Agent Host 与固定 Runtime readiness。"
    environment: "Desktop local / demo_fast / fresh application process / no cloud Skill service"
    actual_result: "已执行 pnpm tauri:dev 完成资源同步、前后端构建与 Host readiness；随后从 fresh local + demo_fast debug app 零登录进入 /plugins。完整 verification 仍因 real_smoke 未含模型调用且 representative failure 未跑而保持 NOT RUN。"
  real_smoke:
    status: "NOT RUN"
    command_or_steps: "打开 /plugins，离线安装代表 Skill，验证默认启用与下一轮模型真实调用；再验证停用、重启、重新启用、卸载和外部删除同步。"
    environment: "Desktop local / demo_fast / bundled Skill fixture / real Agent Host and pinned Runtime"
    actual_result: "fresh Desktop frame 已完成离线安装默认启用、停用、Desktop/Host 重启保持、重新启用、确认卸载并核对只删用户副本；再次安装后外部移走目录，页面重入恢复未安装。未发起付费模型真实对话，未验证即时 watcher，因此完整项未通过。"
