    environment: "Host local / demo_fast / malicious local fixture / real Host file boundary；Desktop stable error/retry projection"
    actual_result: "Host 已拒绝摘要损坏与 Zip Slip 包并验证无半安装/越界写入；Desktop 稳定错误映射与原位重试 UI 已通过 focused tests，但尚未在真实 Tauri frame 点击恶意 fixture。"
