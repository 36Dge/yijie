      command: "make contract-check"
      status: "PASS"
      exit_code: 0
    - repository: "yijie-agent-host"
      command: "make test"
      status: "PASS"
      exit_code: 0
    - repository: "yijie-agent-host"
      command: "make lint"
      status: "PASS"
      exit_code: 0
    - repository: "yijie-agent-host"
      command: "make runtime-test"
      status: "PASS"
      exit_code: 0
    - repository: "yijie-agent-host"
      command: "YIJIE_SKILLS_BUNDLE_ROOT=../yijie-skills/dist/skill-packages go test -race ./internal/integration -run '^TestLocalDevelopmentCopywritingBundleConsumption$' -count=1"
      status: "PASS"
      exit_code: 0
    - repository: "yijie-desktop"
      command: "pnpm skills:sync:local && pnpm skills:check:local && pnpm skills:release-boundary && pnpm tauri:build:demo-fast"
      status: "PASS"
      exit_code: 0
    - repository: "yijie-desktop"
      command: "pnpm test:demo-fast"
      status: "PASS"
      exit_code: 0
    - repository: "yijie-desktop"
      command: "pnpm lint && pnpm build"
      status: "PASS"
      exit_code: 0
    - repository: "yijie-desktop"
