      command: "pnpm breaking HEAD && pnpm breaking ea48fe190e18afba728712d1e2cc79cda57f581b"
      status: "PASS"
      exit_code: 0
    - repository: "yijie-agent-host"
      command: "make contract-check"
      status: "PASS"
