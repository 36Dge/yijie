product_ux:
  status: PASS
  primary_user: 在当前项目会话中查询一个Amazon US公开商品并理解真实MCP执行、安全结果及失败的本地用户。
  problem: 固定Runtime原生接入已验证；用户已排除业务失败场景的实现/验证并确认余额充足、授权10次MCP业务请求。当前已实现原生MCP审批承接、native Tool安全展示与兼容reader，待canonical及真实D4；不恢复旧v5对账/封口。
  user_outcome: 通过普通Composer查询指定US ASIN，原生McpToolCall展示身份、参数/结果、status/error/适用duration与历史来源，助手摘要与真实数据一致；没有数据与失败分开。
  in_scope:
    - 服务sorftime，streamableHttp，origin https://mcp.sorftime.com；秘密只作运行时引用。本轮D0已核实官方Bearer，累计获10次原生发现授权（含内部请求），已执行8次；固定0.144.6加入真实User-Agent后操作7ready、操作8返回97工具，连接阻塞关闭，见13。
    - 首期只读单商品详情，product_detail及asin/amz_site输入schema已原生确认；输出采用原生文本块安全投影；只读用途明确、不承诺服务端幂等，余额由用户确认，业务请求上限10次，费用细则未知不作本轮阻塞，精确原生enabled_tools白名单。
    - Codex原生MCP连接/发现/调用/身份/生命周期/历史必须复用；Host只做配置/秘密/原生审批和安全投影薄适配。
    - native专用只读Tool模型，完整对象替换；原生status、availability、busy、实时/历史来源分开。
    - 首期Sorftime仅在请求批准及原生on-request/user/workspaceWrite/networkAccess=false、Prompt且无审批替代的有效配置下激活；其它模式不激活Sorftime，不自动改FEAT-152模式，见13。
    - 首期秘密仅存内存，复用canonical受管进程环境，正常重开重新隐藏输入；原生exclude还须核对set不能重新注入。无新凭据存储或接口。
    - 兼容reader先于新字段写入，复用唯一NativeDisplayBuffer/SQLCipher/thread-read；新增schema15前向格式版本保护已实现并通过正常合成数据迁移测试，用户数据迁移待canonical，不改历史迁移。
    - 真实成功、空结果判别、正常重开与相关UI/权限回归；CAP-017/GS-004为当前未完成目标。
  out_of_scope:
    - 用户明确排除AC-004/F144-S03业务失败场景实现与验证；不新增业务错误分类、失败专用流程/样本或失败触发逻辑，旧要求归档，排除不算PASS。既有原生错误/安全拒绝仍如实处理。
    - 本轮已授权按16实施产品及新增前向格式migration，不为消耗预算而调用；业务10次和模型8次已独立授权，本地提交及必要修复已授权、推送未授权；元数据发现累计获10次授权，已用8次，固定Runtime原生初始化/列举已成功，不重复连通性测试；不沿用旧额度。
    - 不将未实施view_image备选、Command或dynamic image当MCP交付；不新增其它平台/批量评论/收藏写入/监控/导出。
    - 不自建MCP客户端/HTTP业务调用/代理/bridge/新SDK执行器，不修改或升级Codex Runtime。
    - 不恢复v5主链、状态推演、正文对账、身份猜测、第二累计、历史重建或自动封口；不解析rollout或启用实验历史。
    - 不改FEAT-152三模式语义、不设Approve绕过MCP请求，不重启FEAT-137。
    - 不落密钥到版本库/CLI/TOML/日志/模型/SQLCipher/bbolt，不复制用户DB/凭据；不以环境变量名含KEY推定隔离。
    - 不强杀、攻击/故障注入、坏key/断网/权限破坏/耗尽额度制造失败，不转用历史预算。
  main_flow:
    - 先完成实际manifest、已授权预算、秘密路径、MCP审批/持久兼容前置核验，未满足不激活。
    - 用户在现有项目Composer提供US和公开ASIN，缺参数先正常澄清；不擅自搜索或批量扩展。
    - Codex仅向获准sorftime工具执行原生调用；原生Prompt经默认稳定elicitation空表单薄适配承接；按request/thread/可信turn关联，以实际tool_params核对单ASIN/US，不猜Tool Item或从正文猜参数；未支持/参数不明保持拒绝。
    - Host只投有界安全原生文本/元数据；Desktop经唯一native缓冲与SQLCipher显示真实McpToolCall，模型回答独立核对。
    - 正常退出重开同一已保存记录；自然失败/空结果按原生事实表达，重试需新明确用户意图。
  visual_direction: 复用Timeline/Item shell、token、折叠、键盘、安全复制；展示安全服务/工具名和结果摘要，状态/availability/busy及实时/thread-read来源分离，无原始URL/密钥/错误对象。
  ui_states:
    idle: 未配置或前置条件未通过明确不可用，不造工具卡，不自动连接/注册其它工具。
    loading: 只在可信活跃Turn和实际started时显示busy；progress为0合法，不造步骤或轮询。
    success: 原生completed保持；另验证返回数据与助手摘要，完成不等于数据完整或业务判断正确。
    empty: 原生completed且无可展示文本时只说明该事实，不据此猜商品不存在；合法空、字段缺失、容量与availability分开，不改failed。
    error: 只有原生failed映射工具失败，使用安全固定文案/允许代码；不解析结果正文重判状态，不泄漏原始错误/秘密URL。
    retry: 用户新的明确意图才再查询；保留Codex固有MCP恢复语义，分别计量逻辑操作与可观察尝试，收费规则未明确、不承诺重发免费，不另造重试器或声称MCP零重试。
    cancel: 复用原生Turn控制及MCP请求决议/失效，Turn不封口Tool；未支持请求拒绝，不伪造取消或完成。
