product_ux:
  status: PASS
  primary_user: 使用易界桌面端的跨境电商卖家
  problem: 用户需要通过对话或表单建立本机定时计划，并以明确授权、真实运行记录和正确对话定位管理结果。
  user_outcome: 通过对话或手动设置建立本机计划，管理启停与运行，查记录并打开对应完整对话。
  in_scope:
    - 既有定时任务导航与独立页面，两Tab、搜索刷新排序及空态；移除会员营销和推荐案例
    - 对话预填与草稿保护，发送后澄清确认、与手动创建同源保存
    - 任务表单、跨境占位词、时间时区、运行于三种聊天模式
    - 卡片启停编辑、查看历史、立即执行、删除确认
    - 执行记录指定四状态筛选、详情、独立重跑和完整对话
    - 真实Codex执行复用、本地持久恢复、权限审批及应用内重要更新
    - 易界2.1.0组件规范、亮暗主题、最小窗口和键盘等效交互
  out_of_scope:
    - Git提交推送、部署与生产写入
    - 会员订阅、推荐案例、项目创建/筛选、高级Cron或RRULE编辑器
    - 云调度、跨设备、OS常驻守护进程与退出App后的自动运行
    - Coze工作流/电商节点业务、自动商家写操作、多租户生产或SLA
    - 未批准的Runtime升级替换、自建调度引擎、第二套聊天状态机或明文历史
    - macOS系统通知首期延期；防自动空闲睡眠及睡眠后停止发送由用户明确排除；应用内重要更新仍在范围
  main_flow:
    - canonical local零登录首页，点击既有定时任务菜单进入管理页
    - 通过对话预填后由用户发送确认，或手动填写名称内容时间和运行目标再保存
    - 权威保存成功显示卡片与下一次执行，按计划或显式手动触发并沿既有Codex执行链运行
    - 查看执行记录/详情，打开正确完整对话，支持暂停编辑/安全删除与正常重开
  visual_direction: 易界Design System 2.1.0纯白/石墨/青柠，沿用Yj页面与Naive UI组件；PDF只参考信息结构与交互。
  ui_states:
    idle: 显示已确认计划与历史；引导词仅是未发送草稿。
    loading: 首屏骨架与局部操作loading，禁重复提交，保留安全离开和状态查询出口。
    success: 权威回执后更新卡片/记录；受理成功不等于运行成功。
    empty: 区分无计划、无记录、无搜索结果、无可选聊天，提供对应下一步。
    error: 保留草稿或最后确认状态，展示安全原因，不静默跳换会话或伪造终态。
    retry: 读取/保存可安全重试；投递不确定先查询，运行重试为显式新记录。
    cancel: 草稿取消不保存、脏数据需确认；删除取消无副作用；运行取消沿原生中断。
