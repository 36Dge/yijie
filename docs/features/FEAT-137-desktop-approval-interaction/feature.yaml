  - id: "AC-005"
    statement: "只有精确 argv git rev-parse --is-inside-work-tree、单 action、当前 workspace root cwd且Runtime sandboxPermissions=use_default可进入pending；其它Command、缺失/未知/escalated/additional provenance与shell/网络/权限边界一律fail closed。"
    verification: "allowlist、cwd canonicalization、shell wrapper、pipe、redirect、env、多 action、network、必填sandboxPermissions三值与仅use_default eligible、unknown reverse request focused tests。"
