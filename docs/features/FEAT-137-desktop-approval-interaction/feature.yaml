schema_version: 3
delivery_profile: "demo_fast"
exposure: "local"

feature:
  id: "FEAT-137"
  slug: "desktop-approval-interaction"
  title: "Desktop 本地 Command 审批交互"
  status: "active"
  created_at: "2026-08-30"
  requirement_owner: "段成威"
  technical_owner: "段成威"
  reviewer: "段成威"
  release_owner: "段成威"

scope:
  risk_level: "high"
  data_classification: "restricted"
  contract_impact: "semantic"
  database_change: "expand"
  persistence_change: "durable"
  runtime_change: "none"
  auth_permission_change: "permission"
  user_workflow_change: "user_visible"
  ui_change: "interactive"
  ai_behavior_change: "none"

repositories:
  - "yijie"
  - "yijie-contracts"
  - "yijie-agent-host"
  - "yijie-desktop"

timebox:
  target_hours: 12
  hard_stop_hours: 16
  no_progress_minutes: 30
  same_blocker_minutes: 90
  non_core_limit_minutes: 120
  core_blocker_minutes: 240

product_ux:
  status: "PASS"
  primary_user: "在易界 AI Desktop 的本地 demo_fast 会话中，需要明确决定一条受限只读 Command 是否执行的用户。"
  problem: "Contracts v6、Host approval authority、Desktop closed consumer/SQLCipher/inline interaction与canonical v4/v6 authority composition已冻结。fresh D4可正常启动app/Runtime/Host/Provider，但真实请求没有形成可操作inline approval authority；accept/cancel、approval replay/expiry与approval-card人工视觉仍未验证。"
  user_outcome: "在唯一允许的本地 Git 仓库检查请求到达时，用户在对应 Command Item 内看到安全摘要，只能选择允许一次或取消本轮；决定真实返回 Runtime，断线、过期和重复操作全部 fail closed。"
  in_scope:
    - "CAP-019 / GS-005 的 local/demo_fast stable Command approval reverse request 闭环。"
    - "仅 exact FEAT-137 gate 下把 approvalPolicy 从 never 切换为稳定 on-request；sandbox 始终 read-only。"
    - "Host 受管的精确 prompt policy 与唯一 argv git rev-parse --is-inside-work-tree；cwd 必须为当前 workspace root。"
    - "Host 固定投影 accept_once/cancel_current_turn、120 秒 TTL、single-response、pending snapshot、content-free bounded audit；TTL 竞争获胜时只向 Runtime 发送一次 Cancel 并投影 expired。"
    - "Contracts v6 source-first approval surface，以及 Desktop inline Item、权威 resolved、SQLCipher 安全状态与无障碍交互。"
  out_of_scope:
    - "独立 decline-and-continue、session approval、exec-policy/network amendment、始终允许或离线批准。"
    - "任何其它 Command、shell wrapper、管道、重定向、环境赋值、多 action、网络、写入、额外权限或 unsandboxed escalation。"
    - "CAP-020 一般权限/MCP elicitation、CAP-021 requestUserInput、平台业务审批与生产审批。"
    - "FileChange、Diff、FileChange approval、写权限与已取消的 FEAT-138。"
    - "修改、升级、替换、重编译或重新 pin 最终冻结 Runtime；开启 experimental API。"
    - "强杀、故障注入、权限破坏、binary 替换、攻击 fixture、发布与生产写。"
  main_flow:
    - "canonical local/demo_fast stable runner 在 FEAT-134/136 foundation 与 exact FEAT-137 gate 下启动；Host 明确使用 on-request/read-only，默认和非 local 继续 never/read-only。"
    - "Runtime stable Command reverse request 到达 Host；Host 验证 thread/turn/item/request identity、唯一 argv、workspace cwd 和权限边界，并建立 120 秒内存 pending。"
    - "Contracts v6 requested event 与 owner-only pending snapshot 只向 Desktop 投影固定 action identity、安全摘要和 accept_once/cancel_current_turn。"
    - "用户允许一次或取消本轮；Host first-writer-wins 地向同一 Runtime request 回应一次，Desktop 仅按 Host/Runtime resolved 与 Item/Turn authority 更新。"
    - "断线时 Desktop 禁用动作；正常重连按 Host snapshot 对账；TTL 先到时 Host first-writer-wins 地向仍在等待的 Runtime request 发送一次 Cancel 并记 expired；若 Runtime/Item/Turn 已先清理则记 resolved_elsewhere 且不再响应；resolved audit 随 session 有界保留。"
  visual_direction: "继承 FEAT-133 Item shell 与 Yijie Design System；审批卡内联在对应 Command Item，不使用全局弹窗，不抢占不相关焦点；动作、风险、状态和失败均以文字、图标与克制 aria-live 表达。"
  ui_states:
    idle: "没有 active Turn 或审批请求时不显示审批卡，默认策略说明仍为 read-only。"
    loading: "Pending 显示固定安全动作与剩余有效期；Submitting 后两个按钮均禁用，不预先显示已允许。"
    success: "仅在 Host/Runtime resolved authority 到达后显示已允许一次；最终执行结果仍由 Command Item terminal 决定。"
    empty: "active Turn 没有 pending approval 时不制造空卡、fixture 卡或 requestUserInput 卡。"
    error: "stale、expired、disconnected、version mismatch 或 permission denied 只显示 stable code 与安全说明，不泄露 command、cwd、reason 或 wire。"
    retry: "决定请求不自动重试；传输结果未知时先读取 Host pending snapshot，对同一 request 不重复提交。"
    cancel: "按钮明确标为取消本轮；Host 返回 Runtime Cancel，目标 Command 不执行，Turn 由权威 interrupted/terminal 结果封口。"

must_acceptance:
  - id: "AC-001"
    statement: "只有 exact local + demo_fast + FEAT-137 gate 才启用 approvalPolicy=on-request；默认、gate 关闭和非 local 始终保持 sandbox=read-only、approvalPolicy=never。"
    verification: "配置矩阵与 Host tests 覆盖 thread/start、turn/start、默认/非 local 回归和 capability negotiation；Runtime pin/schema 不变。"
    status: "pending"
  - id: "AC-002"
    statement: "真实 stable Command reverse request 绑定 thread、turn、item、request/approval identity，并在对应 Command Item 内只显示固定安全动作及 accept_once/cancel_current_turn。"
    verification: "Contracts closed fixtures、Host projection conformance 与 Desktop inline card tests；不依赖 Runtime experimental availableDecisions。"
    status: "pending"
  - id: "AC-003"
    statement: "用户允许一次时 Host 对同一 pending request 只响应一次，Runtime 仅在 read-only sandbox 内继续，Desktop 由权威 resolved 与 Command terminal 更新。"
    verification: "single-response/race tests；后续 Owner 单独授权的真实 allow vertical 验证一次执行且无 unsandboxed retry。"
    status: "pending"
  - id: "AC-004"
    statement: "用户取消本轮时 Host 只发送一次 Runtime Cancel，目标 Command 不执行，UI 不把该动作表述为 decline-and-continue。"
    verification: "Host cancellation correlation 与 Desktop wording/state tests；后续真实 cancel vertical 观察 Command declined 与 Turn authoritative terminal。"
    status: "pending"
  - id: "AC-005"
    statement: "只有精确 argv git rev-parse --is-inside-work-tree、单 action 和当前 workspace root cwd 可进入 pending；其它 Command、shell/网络/权限边界一律 fail closed。"
    verification: "allowlist、cwd canonicalization、shell wrapper、pipe、redirect、env、多 action、network、additional permission 与 unknown reverse request focused tests。"
    status: "pending"
  - id: "AC-006"
    statement: "双击、重复 event、迟到 response、120 秒过期和 Item/Turn terminal cleanup 最多接受一个有效决定；TTL 先胜时只向仍 pending 的 Runtime request 发送一次 Cancel 并投影 expired，Runtime/Item/Turn 已先清理时投影 resolved_elsewhere 且不再响应。"
    verification: "Contracts duplicate/stale/expired/resolved_elsewhere fixtures、Host first-writer-wins/TTL-Cancel/race tests 与 Desktop stale action tests。"
    status: "pending"
  - id: "AC-007"
    statement: "Desktop/SSE 断线立即禁用审批动作，正常重连仅按 Host pending snapshot 对账；Host/Runtime 断开或重启不留下可操作悬空审批，也不自动批准。"
    verification: "安全 transport lifecycle tests 与正常断开/重连观察；不通过强杀或故障注入制造证据。"
    status: "pending"
  - id: "AC-008"
    statement: "WebView、日志、安全复制、SQLCipher 与 Host audit 不含 raw command、绝对路径、reason、secret 或 Runtime wire；resolved audit 每 session 最多 128 条并随 session 删除。"
    verification: "secret/path canary、redaction、clipboard、persistence 与 bounded retention tests；证据只保存 content-free fields。"
    status: "pending"
  - id: "AC-009"
    statement: "Approval 使用显式协商的 Contracts v6，v1-v5 保持不变；FileChange、permissions、MCP elicitation、requestUserInput 及 unknown reverse request 保持 fail closed且不生成 UI。"
    verification: "v6 generation/digest/breaking、v1-v5 equality、Host unsupported method 与 Desktop unknown closed decoder tests。"
    status: "pending"
  - id: "AC-010"
    statement: "Pending、submitting、accepted、cancelled、expired、resolved elsewhere 与 disconnected 状态在对应 Item 内可读，并支持键盘、焦点恢复、状态文字/图标、aria-live 和安全复制。"
    verification: "Desktop component/domain tests；后续 D4 验证 light/dark、1180×760、200%、键盘、VoiceOver 与正常重开。"
    status: "pending"

