product_ux:
  status: PASS
  primary_user: 在易界普通对话或显式专家对话中生成图片的用户
  problem: 当前原生图片专用入口和用户自备Key不符合统一媒体能力及开箱可用要求
  user_outcome: 未选专家时内置MCP直接可用；选定专家不可用或失败时保留选择并报告，不自动替代
  in_scope:
    - 复用Runtime原生MCP发现、执行、审批与Code Mode
    - 非公开部署由易界运营方预置凭据，Host复用Keychain非交互读取
    - 可信专家绑定、原生MCP配置排除和Host准入；无自动兜底
    - 复用单图单参考图及Artifact提交预览保存
    - 用现有Runtime配置一次停用旧原生入口并退役Host图片业务handler和dynamic注册
    - 复用原生继续执行和get_artifact_status，不增加重复调度或状态服务
  out_of_scope:
    - 未单独获准的计费调用、公开部署、提交与推送
    - Seedance接入、视频工具、多图扩展与通用任务平台
    - 过渡双写、旧客户端兼容和历史数据迁移
    - 公网生产部署、签名发布和商业计费系统
    - Runtime补丁重基或schema改变、媒体API、生成任务数据库、Broker结果协议
  main_flow:
    - 原客户端与local自动身份进入普通对话，运营方预置凭据，用户零供应商配置
    - 读取受信显式专家绑定，选定专家按原资格和提交流程执行
    - 专家不可用或失败时报告原状态，pending和unknown也不换内置
    - 供应商结果经现有Artifact链与Native提交ACK后呈现图片
    - 保留专家绑定，仅用户显式更改或移除后的新请求改变路由
  visual_direction: 复用现有工具活动、图片卡片和预览，只补准确路由与结果状态
  ui_states:
    idle: 原输入框、附件和专家选择
    loading: 显示真实执行来源与生成中，不提供虚构百分比
    success: Native提交确认后展示可预览保存的图片
    empty: 无图片时明确未交付，不用占位图冒充
    error: 区分内置服务未配置、专家失败、交付失败和结果未知，不索取方舟Key
    retry: 新用户生成请求才新建操作，读取和ACK恢复不触发生图
    cancel: 停止新准入与迟到发布，远端取消未知则如实报告
must_acceptance:
  - id: AC-001
    statement: 唯一内置生图入口为自动装配的MCP，旧原生和dynamic入口退役
    verification: 02-verification.md V01/V02
    status: pass
  - id: AC-002
    statement: 运营方凭据预置下用户零供应商配置且无Key或隐式Keychain授权窗
    verification: 02-verification.md V03
    status: pass
  - id: AC-003
    statement: 单图文生图和单参考图真实生成，普通图片分析零生成调用
    verification: 02-verification.md V04
    status: pass
  - id: AC-004
    statement: 显式专家仅使用其配置能力，不可用时保留绑定并报告
    verification: 02-verification.md V05
    status: pass
  - id: AC-005
    statement: 专家失败或缺能力时内置调用数为零，处理中未知取消拒绝均不自动替代
    verification: 02-verification.md V06/V07
    status: pass
  - id: AC-006
    statement: 并发重复和正常重开不重复提交，同操作不同参数拒绝
    verification: 02-verification.md V08
    status: pass
  - id: AC-007
    statement: 内置图片复用Artifact提交ACK和状态查询且不依赖文档开关
    verification: 02-verification.md V09
    status: pass
  - id: AC-008
    statement: 正常取消贯穿调用链且迟到结果不翻转终态受限会话无付费资格
    verification: 02-verification.md V10
    status: pass
  - id: AC-009
    statement: 固定Runtime与schema保持并复用MCP原生结果继续执行搜索和view_image
    verification: 02-verification.md V11
    status: pass
  - id: AC-010
    statement: 无新增平台数据库或重复状态协议且无需市场服务选择授权及文档开关
    verification: 02-verification.md V12/V13
    status: pass
