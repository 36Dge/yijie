    summary: 当前最终候选自审与摘要复核完成。收口新增仅Coze本地UI三文件：键盘移动/具名连接按钮、焦点/错误关联与提示，仍使用同一WorkflowDocument和既有canvas/wire，无新服务/原生权限。四个其他候选、十二仓身份与受保护设计文件不变；Coze6份原缺失保留，15297上游文件保持、2声明overlay。运行时实测与来源/交付顺序见17和14；不伪称独立人工审查或已提交。
  known_limitations:
    - 本地demo_fast D4通过，不代表DP、production_hardened、发布tag、CI/merge或公网/生产就绪。用户已授权Git交付；各仓实际commit/push和Coze远端状态见18。上游origin禁止推送本地适配。跨仓顺序见14。
    - 首次打开中的取消在正常快速响应及一次有界AX观察中未命中，真实取消点击未执行；按13预先约定单列，普通UI/native pending-open时序测试PASS。无延迟或故障注入，不伪称真实点击通过。
    - 新增控件与核心键盘编排、亮暗两尺寸可用；不声明全页axe/WCAG认证。原白底青柠1.28:1对比度例外按用户要求保留；disabled透明度和所有边框/端口未作全量对比度认证。
    - 机器凭据扫描覆盖实际AX、dev5个公开HTTP资源、最终49公开文件和真实native binary；未进行heap或MessagePort dump。E隔离结合源契约/native投影、CSP及真实自然生命周期验证；不把秘密注入页面测试。
    - 旧Chat合成记录只读打开后原DEMO_FAST_OK回答仍在；该旧记录同时显示删除尚未完成提示，本轮未触发删除/修复，也未发送Chat消息，不宣称Chat全量验收或消除此独立历史状态。
    - 运行中缩窗保留当前视口，可手动适应画布；不承诺每次尺寸变化都自动重置。中间被macOS钳制的1346尺寸截图不计目标尺寸通过，最终1440x900和1180x760均有实际几何与原尺寸PNG。
    - 历史API回执和旧诊断数据保持原事实，不补写或改写。已完成操作若后续草稿改变，完整Workflow回放可返回operation_unknown；独立receipt仍为真实completed，不将后来的画布冒充旧结果。
    - Coze与依赖仅internal；API另连专用edge支持Docker loopback发布，不能宣称物理禁止API全部出站。实际业务仅固定Coze地址，无模型/平台/通用代理。
    - 历史攻击、危险归档、权限破坏、强杀和Runtime篡改测试依用户长期规则未执行；只声称安全focused范围，不声称全仓通过。Desktop旧Chat tests-target clippy问题没有在本需求改写。
    - 模型/商家/平台/付费调用为0；不实现具体ERP节点、长任务/在途恢复、生产多租户、数据删除或schema降级。
    - 凭据助手历史等待记录保留；最终没有残留，不将其消失描述为强杀、反复信号或Keychain修复。App/栈正常退出，四数据卷保留，原厂Docker正常停止。

