schema_version: 3
delivery_profile: "demo_fast"
exposure: "local"

feature:
  id: "FEAT-153"
  slug: "coze-workflow-foundation"
  title: "yijie-coze 仓库接入与工作流基础集成"
  status: "usable" #最终本地D4通过；见17；Git交付另见18；不包含公开运行发布
  created_at: "2026-09-12"
  requirement_owner: "段成威"
  technical_owner: "段成威"
  reviewer: "段成威"
  release_owner: "段成威"

scope:
  risk_level: "high"
  data_classification: "internal"
  contract_impact: "semantic" #整体semantic；5.4消费已有业务wire，首次fit只改变本地视口
  database_change: "expand" #两库独立expand migration已在真实local栈显式执行
  persistence_change: "durable" #合成草稿、内部版本、原生执行/节点历史已写入且正常重开读回
  runtime_change: "platform" # 增加 Coze 工作流服务；不修改 Codex Runtime
  auth_permission_change: "both" #local机器凭据/epoch、App固定scope与原生关闭确认已按第5步实测
  user_workflow_change: "user_visible"
  ui_change: "interactive"
  ai_behavior_change: "none"

repositories:
  - "yijie"
  - "yijie-coze"
  - "yijie-contracts"
  - "yijie-api"
  - "yijie-infra"
  - "yijie-desktop"

timebox:
  target_hours: 12
  hard_stop_hours: 16
  no_progress_minutes: 30
  same_blocker_minutes: 90
  non_core_limit_minutes: 120
  core_blocker_minutes: 240

product_ux:
  status: "PASS" # 已批准方向，05完成native/session/CSP与资源设计；D0由实际检查验证
  primary_user: "在本机验证易界工作流能力的产品负责人；后续跨境卖家服务以此为基础，本期仅合成通用流程。"
  problem: "初始 Coze 目录未治理、工作流页仅静态；第1步已完成本地来源与仓库接入，仍缺同一易界入口的编排、持久保存、版本执行和历史闭环。"
  user_outcome: "从现有工作流页零登录进入真实编辑器，创建并保存通用三节点流程，试运行后内部发布，执行固定版本并查看结果和历史；正常退出重开后仍可使用。"
  in_scope:
    - 先审计，再恢复已核实的上游 Git 元数据、固定 source provenance，接入 12 仓清单与专用开发治理。
    - 同一 Desktop 内独立 HTTP 静态 Coze React iframe，固定127.0.0.1:18888；MessageChannel只转发版本化工作流操作，经具名native进入API，editor无native capability。
    - exact local + demo_fast + YIJIE_WORKFLOW_ENABLED=true；native/server固定scope、两段服务机密及300秒resource-bound编辑会话E只在原生/服务端。
    - 真实列表、创建、读取、草稿保存/重开、revision 冲突、试运行、内部发布、固定版本执行、结果/历史查询。
    - 开始/原生文本concat/结束；安全但不完整草稿可保存，完整三节点才可运行发布；4KiB input/1KiB prefix/5KiB output/256KiB canvas/512KiB message，共用1个在途槽位和30秒合作式预算。
    - 独立 Coze 数据与受控 local Infra、loopback、readiness、正常停止/重开、安全 focused checks。
  out_of_scope:
    - "任何具体 ERP 或电商服务、真实店铺数据、平台凭据、商家 API、订单或资金写入。"
    - "模型/AI 节点、HTTP/Code/插件节点、Agent/Runtime 节点、外部 provider 调用及任何付费调用，预算均为 0。"
    - "完整 Agent/应用/知识库产品、定时触发、持久队列、在途执行自动恢复、补偿与长任务承诺。"
    - "public/production、多租户上线、真实用户身份、DP/G5/G6、全量 CVE/渗透或生产供应链认证。"
    - "未经用户明确授权创建远端或发布；tag/release、删除 volume 或重建用户数据。2026-09-13用户已另行授权FEAT-153 commit/push。"
    - "改写既有 Chat/Host 数据、修改 Codex Runtime、恢复 FEAT-137、暗改用户保留的布局/青柠色或继承历史 D4。"
  main_flow:
    - "按 canonical local demo_fast 入口正常启动同一个 Desktop，零登录进入现有主页面，再打开工作流；不选工作流时 Coze 未就绪不阻断原 Chat 启动。"
    - "工作流服务未就绪时显示明确提示和正常启动/重试入口；ready 后读真实资源列表，静态 ERP 推荐不得伪装已实现。"
    - "创建通用流程，受信 native/server 自动绑定固定本地 scope 和 Coze 资源，进入同一 App 内真实编辑器，无第二次登录。"
    - "配置开始→文本拼接→结束，保存草稿，返回列表并重开同一 ID；只在 provider 确认保存后显示成功。"
    - "试运行草稿并检查节点输出；成功后内部发布固定版本，不使用 Force，也不向公网发布。"
    - "从易界执行已发布版本，按真实 run ID 查询原生状态、结果与历史；以后保存草稿不改变已发布版本或历史。"
    - "普通输入错误修正后重试；结果不确定先查询，不自动重复创建/发布/执行；执行完成后正常停止并重开核对数据。"
  visual_direction: >-
    保留用户当前工作流页布局、自然换行分类、无图标底板、灰色热门/推荐标签、青柠执行主按钮和中性演示次按钮；新编辑器有清晰返回、保存、试运行、内部发布与版本执行入口。 复用既有主题与焦点样式；亮/暗主题、1180×760 和 1440×900 核验新增 UI。已知白底青柠说明为 1.28:1、1 项 serious color-contrast，保留用户配色并独立记录，不能写全页 axe PASS。
  ui_states:
    idle: "显示真实流程及草稿/内部版本、可执行性与最近运行；Coze 未启用时显示尚未就绪，不用演示卡状态代替。"
    loading: "区分服务准备、列表、编辑器、保存、试运行/执行；禁用重复写入，显示当前 operation/run，保留返回与可行的取消入口。"
    success: "仅在 provider 确认后更新资源 ID/revision/version；运行成功以原生终态及结果为准，不由前端计时猜测。"
    empty: "没有真实流程时提示创建通用流程；没有历史时明确空历史，静态 ERP 卡标示示意且不宣称可执行。"
    error: "分别呈现服务不可用、编辑器加载失败、无权/资源不存在、保存冲突、输入错误和运行失败；保留未保存内容及已知状态。"
    retry: "读请求可显式重试；写结果未知先查询原operation/run，不自动新建操作。E到期保留同一iframe内存草稿并禁写，可信父页显式重连新E/port/generation且核对revision，不reload或自动覆盖画布。"
    cancel: "返回/关闭有未保存内容时确认保留或放弃；停止等待仅取消本地等待，不标远端已取消；首期不承诺运行中止，须等待真实终态再正常停止服务。"

