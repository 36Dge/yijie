product_ux:
  status: PASS
  primary_user: 在易界正式对话中查看生成产物与已发送文件的本机用户
  problem: 当前无同页右侧文件阅读区；HTML独立窗及已发送附件缺读取入口无法形成并排阅读和多文件切换
  user_outcome: 点击真实文件或右栏按钮展开只读预览，使用新标签页并拖动分隔线调整两侧宽度
  in_scope:
    - 默认关闭的右侧预览栏及双入口
    - 生成产物与已发送附件的真实身份路由，排除图片视频SVG
    - 新标签页创建、空页填入、真实ID去重、切换关闭及10页容量
    - HTML隔离渲染脚本及已有文本投影；DOCX/PPTX/XLSX/PDF真实正文或页面内容
    - 精确分栏默认值上下限、拖动键盘及窄宽处理
    - 七态反馈、正常释放和迟到请求隔离
    - 先审yijie-codex原生封装并复用Runtime工具、publish、spool、Native提交ACK及授权读取，不重造工具机制
  out_of_scope:
    - 文件修改保存下载分享打印删除发布或系统打开
    - 文件操作、HTML页面业务动作、链接导航与外部副作用；保留已确认的隔离渲染脚本
    - 任意URL或磁盘访问、完整办公编辑器/OCR/全保真排版、云转换与新生成发布传输服务
    - 标签持久化跨会话恢复、拖拽排序固定和批量管理
    - Runtime协议工具或AI行为扩展、日常数据迁移和公开发布
  main_flow:
    - canonical local正式对话默认关闭，按钮展开显示空状态
    - 点击有效文件引用，激活已有标签或填入空标签或新建文件标签
    - 在隔离只读区域显示分级内容，不打开独立窗或触发模型
    - 加号创建空标签，切换关闭按R-03执行；单激活展示，单在途读取与最新待发意图合并
    - 拖动分栏同步改变对话与预览宽度，收起释放资源并恢复对话宽度
    - 换会话离页重启清空临时标签并回到关闭状态
  visual_direction: 复用易界tokens和图标；中性标签条与只读标题行，右栏目标60%并受两侧至少400px约束；详细公式见00 R-06
  ui_states:
    idle: 右栏默认关闭且不占位，不后台读取；新文件生成不自动开栏
    loading: 激活标签显示名称与正在加载预览，不伪造进度，关闭切换始终可达
    success: 显示真实分级内容及只读标识，内容区域独立滚动
    empty: 当前没有文件展示；提示在对话完成任务生成产物并点击文件；新标签同样为空
    error: 区分超限不支持缺失过期拒绝、完整性失败与资源忙；不泄漏路径、不困住对话
    retry: 临时失败或资源忙可用户重新加载；UI等待含调度上限15秒，源TTL/完整性失败不可原地重试，无模型调用
    cancel: 关闭收起换会话立即撤销展示并清内容，不能取消的Native工作正常有界收尾，不改任务终态或删除原件
