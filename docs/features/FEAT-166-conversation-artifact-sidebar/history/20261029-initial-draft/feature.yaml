    status: pending
  - id: AC-003
    statement: 图片视频SVG沿原媒体路径，右栏开关标签宽度均不受影响
    verification: 02-verification.md T-03；关闭和展开两态媒体回归
    status: pending
  - id: AC-004
    statement: 新建空标签、文件归属、去重、同名区分与10页容量按R-03工作
    verification: 02-verification.md T-04；真实代表流程及全分支状态验证
    status: pending
  - id: AC-005
    statement: 标签切换关闭末页空状态、同页收起保留、换会话清空及焦点正确
    verification: 02-verification.md T-05；真实UI焦点及资源记录
    status: pending
  - id: AC-006
    statement: 文件分级准确且只读，HTML业务交互禁用，无文件操作入口，原件不变
    verification: 02-verification.md T-06；普通文件逐类内容信息核对和摘要
    status: pending
  - id: AC-007
    statement: 两侧宽度默认上下限拖动键盘复位及窗口变化按R-06生效，对话与输入区同步缩窄
    verification: 02-verification.md T-07；公式边界及实际拖动，误差不超过1 CSS px
    status: pending
  - id: AC-008
    statement: 加载超限不支持缺失过期拒绝超时和重新加载可恢复，不阻断对话或自动重跑
    verification: 02-verification.md T-08；真实普通failure与状态层证据分开记录
    status: pending
  - id: AC-009
    statement: 真实身份授权、单激活资源、迟到结果隔离和正常释放，旧v1及历史wire存储语义保持
    verification: 02-verification.md T-09；Native普通符合性和正常生命周期
    status: pending
  - id: AC-010
    statement: 亮暗最小窗口长名溢出键盘可用，草稿消息锚点持续输出与媒体行为无回归
    verification: 02-verification.md T-10；1180x760真实UI及focused回归
    status: pending
