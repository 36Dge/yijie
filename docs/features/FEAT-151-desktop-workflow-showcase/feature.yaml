schema_version: 3
delivery_profile: "demo_fast"
exposure: "local"

feature:
  id: "FEAT-151"
  slug: "desktop-workflow-showcase"
  title: "Desktop 工作流展示页"
  status: "usable" # draft | active | usable | blocked
  created_at: "2026-08-31"
  requirement_owner: "段成威"
  technical_owner: "段成威"
  reviewer: "段成威"
  release_owner: "段成威"

scope:
  risk_level: "low" # low | medium | high | critical
  data_classification: "public" # public | internal | confidential | restricted
  contract_impact: "none" # none | additive | semantic | breaking
  database_change: "none" # none | expand | migrate | contract
  persistence_change: "none" # none | durable | replay
  runtime_change: "runtime" # none | runtime | platform
  auth_permission_change: "none" # none | auth | permission | both
  user_workflow_change: "user_visible" # none | internal | user_visible
  ui_change: "interactive" # none | visual | interactive
  ai_behavior_change: "none" # none | prompt | model | retrieval | tool | eval

repositories:
  - "yijie"
  - "yijie-desktop"

timebox:
  target_hours: 12
  hard_stop_hours: 16
  no_progress_minutes: 30
  same_blocker_minutes: 90
  non_core_limit_minutes: 120
  core_blocker_minutes: 240

product_ux:
  status: "PASS" # pending | PASS
  primary_user: "需要快速浏览现有与推荐自动化工作流的跨境电商卖家和运营人员"
  problem: "左侧“工作台”仍是禁用入口，用户无法进入参考截图定义的工作流总览。"
  user_outcome: "用户点击左侧“工作流”后进入静态工作流总览，并可完整浏览截图中的分类、已有工作流和推荐工作流信息。"
  in_scope:
    - "将左侧“工作台”更名为“工作流”，启用受 workspace.use 保护的 /workflows 路由。"
    - "完整呈现截图中的顶部分类、我的工作流、创建卡、四张已有工作流卡和四张推荐工作流卡。"
    - "沿用易界 App Shell、Yj 布局组件、design token 与图标 registry，覆盖亮色、暗色和 1180×760。"
    - "修复 canonical demo_fast 启动器在 macOS Bash 3.2 + nounset 下展开空 profile 环境数组失败的问题，并同步静态契约检查。"
  out_of_scope:
    - "任何 API、Agent Host、Runtime、数据库、持久化或真实工作流数据接入。"
    - "分类筛选、排序、视图切换、新建分类、新建工作流、更多、查看全部、演示或执行交互。"
    - "任何二次页面跳转、付费调用、生产写入或外部副作用。"
  main_flow:
    - "用户通过 canonical demo_fast 启动器零登录进入应用，点击左侧“工作流”。"
    - "应用进入 /workflows，侧栏保持选中，页面按截图顺序展示全部静态内容。"
    - "用户滚动浏览顶部分类、我的工作流和推荐工作流；页面内控件均不触发交互或副作用。"
  visual_direction: "保留参考截图的双层分类、工作流卡片网格与推荐流程节点信息架构，使用易界品牌绿、标准密度、轻边框和卡片层级重新表达，不复制外部品牌视觉。"
  ui_states:
    idle: "进入页面前由左侧已启用的“工作流”链接提供清晰入口；不预取任何数据。"
    loading: "不适用：页面只同步读取打包内的只读 TypeScript 常量，不制造虚假 loading。"
    success: "三段内容按固定顺序完整展示，文案、标签、时间、使用量与流程节点和截图一致。"
    empty: "不适用：本需求要求固定展示完整截图内容，打包内数据集合不为空。"
    error: "无 workspace.use 的深链由既有 Router 权限边界在页面实例化前拦截。"
    retry: "不适用：没有远程请求；权限恢复沿用既有设置/权限刷新链路。"
    cancel: "不适用：没有提交、执行、长任务或外部副作用。"

must_acceptance:
  - id: "AC-001"
    statement: "拥有 workspace.use 时，左侧原“工作台”显示为“工作流”可用链接，进入 /workflows 后保持选中且文档标题为“工作流 · 易界 AI”。"
    verification: "导航、Router、App Shell 单测与真实应用 smoke。"
    status: "PASS" # pending | PASS | FAIL
  - id: "AC-002"
    statement: "页面顶部按顺序展示全部、电商获客、批量出图、全网比价、内容创作、视频生成、数据分析、私域运营、更多九个分类。"
    verification: "领域模型与 WorkflowPage 组件测试；截图。"
    status: "PASS"
  - id: "AC-003"
    statement: "“我的工作流”完整展示六个分类、新建分类、最近修改、网格/列表视图标识、创建工作流卡和四张已有工作流卡的全部截图文案与时间。"
    verification: "组件内容、顺序与否定交互断言；截图。"
    status: "PASS"
  - id: "AC-004"
    statement: "“推荐工作流”完整展示刷新标识、查看全部，以及四张推荐卡的标题、热门/推荐标签、说明、三段流程节点、使用量、演示与执行文案。"
    verification: "领域模型与组件测试逐项核对；截图。"
    status: "PASS"
  - id: "AC-005"
    statement: "除侧栏进入 /workflows 外，页面内所有截图控件均只展示，不发起请求、不写持久化、不执行工作流且不产生二次跳转。"
    verification: "组件否定断言、源码调用搜索与真实 smoke。"
    status: "PASS"
  - id: "AC-006"
    statement: "页面只消费本地只读展示模型，不调用 API、Tauri command、Agent Host、Runtime、数据库或浏览器持久化。"
    verification: "依赖/调用搜索、代码审阅和构建产物检查。"
    status: "PASS"
  - id: "AC-007"
    statement: "没有 workspace.use 时导航不渲染；直接访问 /workflows 在页面实例化前进入无权访问页。"
    verification: "权限策略、Router 和 Sidebar 测试。"
    status: "PASS"
  - id: "AC-008"
    statement: "UI 复用 YjPage/YjSection、design token 与 YjIcon registry，在亮色、暗色和 1180×760 下无关键重叠或主体横向滚动。"
    verification: "lint/build、两主题最小窗口视觉检查。"
    status: "PASS"
  - id: "AC-009"
    statement: "页面有唯一 h1、合理 section/article/list 语义；展示型控件不伪装为可用操作，且 axe 无 serious/critical violation。"
    verification: "组件语义断言、axe 与键盘/焦点 smoke。"
    status: "PASS"
  - id: "AC-010"
    statement: "canonical pnpm tauri:dev 在 macOS 默认 Bash 3.2、空可选 profile 环境数组下完成 Desktop/Host 启动并进入 ready，退出后端口与进程正常清理。"
    verification: "启动器回归测试、静态契约检查与 fresh canonical 启动。"
    status: "PASS"

