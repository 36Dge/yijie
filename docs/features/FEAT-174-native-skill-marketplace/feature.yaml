  main_flow:
    - 目录与来源可见但不安装
    - 加号从本地源通过原生安装并核对
    - 个人导入预检后原生安装、单笔发布成功
    - 生命周期与迁移统一读取原生事实，更新和回滚调用原生刷新
  visual_direction: 保留技能卡片五类三列与彩色图标，增加内置技能和我的技能分区及导入按钮
  ui_states:
    idle: 加号或已安装开关，导入按钮
    loading: 读取/预检/等待任务结束/安装/同步，同一市场写入串行
    success: 原生确认后已添加并启用
    empty: 个人空列表导入入口或搜索无结果
    error: 真实格式/权限/Runtime/操作错误及恢复
    retry: 原操作ID先核对原生结果，格式错误重选
    cancel: 提交前清暂存；提交后核对再补偿，未确认不假报取消
