product_ux:
  status: pending
  primary_user: 易界桌面应用用户
  problem: 技能安装管理未复用原生Plugin体系，缺用户导入，Starter自动安装与新默认规则冲突
  user_outcome: 内置全部可见但默认未添加，加号本地添加，导入一次完成并启用
  in_scope:
    - 38项内置普通技能随App分发
    - 一技能一原生插件、两个本地市场
    - 去掉7项默认安装并保留原用户状态
    - ZIP和SKILL.md本地导入
    - 原生启停卸载与调用
    - 最小本地来源策略、兼容与迁移
  out_of_scope:
    - 云端市场和远程下载
    - 批量多技能包和完整插件上传
    - 自动安装任意MCP或新增业务连接器
    - 付费调用和公开发布
  main_flow:
    - 内置目录可见但未安装
    - 点击加号从App本地源由原生安装并启用
    - 个人文件归一化预检后调用同一安装入口
    - 原生快照确认，启停卸载和聊天选择保持统一
  visual_direction: 保留技能卡片五类三列与彩色图标，增加内置技能和我的技能分区及导入按钮
  ui_states:
    idle: 加号或已安装开关，导入按钮
    loading: 读取/校验/添加/同步，单项互斥
    success: 原生确认后已添加并启用
    empty: 个人空列表导入入口或搜索无结果
    error: 真实格式/权限/Runtime/操作错误及恢复
    retry: 原操作ID先核对原生结果，格式错误重选
    cancel: 提交前清暂存；提交后核对再补偿，未确认不假报取消
must_acceptance:
  - id: AC-001
    statement: 全新用户正常启动：38 内置可见、0 安装、0 启用；重扫／重开不自动安装
    verification: 02-verification.md AC-001
    status: pending
  - id: AC-002
    statement: 加号从 App 本地源经原生安装成功并默认开启，网络下载为 0；重试不重复安装
    verification: 02-verification.md AC-002
    status: pending
  - id: AC-003
    statement: 合法单文件及两种正常 ZIP 一次导入完成并启用，资源结构保持；无第二次安装或模型调用
    verification: 02-verification.md AC-003
    status: pending
  - id: AC-004
    statement: 相同内容去重并保留停用选择；同名不同内容与内置共存；卸载不删用户原文件和运行产物
    verification: 02-verification.md AC-004
    status: pending
  - id: AC-005
    statement: 启停／卸载／重开与原生状态一致；内置源和卡片保留；活动回合结束前不删其资源
    verification: 02-verification.md AC-005
    status: pending
  - id: AC-006
    statement: 显式选择、原生点名、隐式发现与按需读取走原生机制；无重复注入或未安装技能泄漏
    verification: 02-verification.md AC-006
    status: pending
  - id: AC-007
    statement: 工具声明、连接器启用／授权与真实可调用状态可区分；不自动安装 MCP 或扩大权限
    verification: 02-verification.md AC-007
    status: pending
  - id: AC-008
    statement: 原安装／启停、选择 ID、聊天历史、专家资源保留；命名空间和旧 reader 不兼容明确处理
    verification: 02-verification.md AC-008
    status: pending
  - id: AC-009
    statement: 新鲜／重开 Runtime 的技能目录与安装链路不访问远程市场；原模型、连接器、媒体仍正常
    verification: 02-verification.md AC-009
    status: pending
  - id: AC-010
    statement: 原生窗口 1180×760 亮暗／键盘、格式错误重选、取消／重试和正常关闭恢复通过；无强杀或攻击 fixture
    verification: 02-verification.md AC-010
    status: pending
