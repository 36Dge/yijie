  contract_impact: semantic
  database_change: expand
  persistence_change: durable
  runtime_change: platform
  auth_permission_change: permission
  user_workflow_change: user_visible
  ui_change: interactive
  ai_behavior_change: tool
repositories:
  - yijie
  - yijie-contracts
  - yijie-agent-host
  - yijie-desktop
timebox:
  target_hours: 12
  hard_stop_hours: 16
  no_progress_minutes: 30
  same_blocker_minutes: 90
  non_core_limit_minutes: 120
  core_blocker_minutes: 240
product_ux:
  status: PASS
  primary_user: 本机易界用户
  problem: Chatbox 权限入口仅展示固定只读策略，不能选择原生审批模式。
  user_outcome: 通过当前入口选择三档真实权限、处理具体审批，并按任务记忆设置。
  in_scope:
    - 加号右侧权限选择弹层
    - 请求批准 / 帮我批准 / 完全访问权限
    - 原生沙箱、人工批准和自动风险审核的薄适配
    - 任务权限持久化、忙时禁止切换、首次完全访问确认
    - 对话内批准本次与拒绝卡片
  out_of_scope:
    - 重启 FEAT-137
    - 自建风险评分、审批引擎或确定性工具 producer
    - 店铺业务审批、组织权限或云端部署
    - 文件 Diff 产品、无关重构或新模型供应商
    - Codex 内核改动与 Runtime 二进制替换
    - 任何 Codex 核心源码或现存 Runtime 二进制改动
  main_flow:
    - canonical local demo_fast 免登录进入 Chat
    - 新任务默认请求批准，用户在入口选模式
    - 首次完全访问先确认，取消保持原设置
    - 提交任务时传递真实 Runtime 权限；排队/运行/待审批禁止切换
    - 人工请求以卡片展示操作与范围，批准本次/拒绝回传 Codex
    - 当前轮结束后允许修改；模式仅影响该任务，重启后恢复
  visual_direction: 截图的锚定弹层、三行图标/标题/说明、选中勾；使用易界现有组件和主题 tokens。
  ui_states:
    idle: 展示当前模式；允许打开选择菜单。
    loading: 权限读取/保存与任务提交期间禁用重复动作；运行中禁止切换。
    success: 持久写入成功后更新模式标签；审批决策成功后更新卡片。
    empty: 新任务默认请求批准；无待审批不显示审批卡片。
    error: 读取、保存或决策失败保留最后确认状态并显示可重试错误。
    retry: 重读当前任务状态；过期或已解决请求不再次执行。
    cancel: Esc/外部点击收起菜单；完全访问取消不修改；拒绝使用原生拒绝语义。
must_acceptance:
  - id: AC-001
    statement: 入口和截图一致，三项文案、描述、图标及勾选状态清晰。
    verification: 组件测试与亮/暗主题及最小窗口视觉检查
    status: pass
  - id: AC-002
    statement: 新任务默认请求批准；当前项目可写，外部写入/联网由 Codex 请求批准。
    verification: 真实 Runtime 与任务流程验证
    status: pass
  - id: AC-003
    statement: 帮我批准使用 Codex auto_review；需人工处理的原生拒绝显示卡片并回传原生批准接口。
    verification: 配置映射与实际原生 auto_review；用户批准的精确普通文件复核规则下真实 deny → 原生批准 → 同任务 auto 续跑 allow。不是默认策略自然风险拒绝。
    status: pass
  - id: AC-004
    statement: 完全访问使用 danger-full-access/never；首次选择必须确认，取消保留原值。
    verification: 配置映射、确认交互和真实任务验证
    status: pass
  - id: AC-005
    statement: 权限只影响当前任务，重启恢复；不同任务互不覆盖。
    verification: 数据库重开和任务切换验证
    status: pass
  - id: AC-006
    statement: 排队、运行或待审批期间 UI 与原生边界都拒绝切换，下一轮使用保存模式。
    verification: 正常并发状态测试
    status: pass
  - id: AC-007
    statement: 人工卡片展示具体操作/影响范围，批准本次与拒绝准确关联请求且不重复执行。
    verification: 原生 RPC 适配测试及真实人工审批
    status: pass
  - id: AC-008
    statement: 旧 FEAT-137 终止边界和既有任务历史保留；无攻击注入或强杀验证。
    verification: 退役边界检查、diff 与安全验证清单
    status: pass
