  hard_stop_hours: 16
  no_progress_minutes: 30
  same_blocker_minutes: 90
  non_core_limit_minutes: 120
  core_blocker_minutes: 240
product_ux:
  status: PASS
  primary_user: 在易界 AI Desktop 中观察 Agent 实时处理过程、阅读最终回答并在稍后重开对话的本地用户
  problem: FEAT-132 已改为原生接入，但 FEAT-134 需求仍依赖旧 reducer/正文对账；当前显示混合 summary/raw，已结束 Turn 的未结束 Item 仍误报忙碌，availability 与诊断表达不足。
  user_outcome: 直接复用 native v7 与唯一 NativeDisplayBuffer，真实区分过程、摘要、原始正文及最终回答；原生执行事实与内容可用性和 UI 忙碌分离，历史只读兼容。
  in_scope:
    - 复用 FEAT-132 原生通道、唯一显示缓冲和加密事实，不新增执行机制
    - summary/content 分类别及原生索引展示，纯文本、无产品复制按钮
    - 只有有效实时订阅观察能开启忙碌；Turn 结束后未 completed 的 Item 保留事实并显示缺结束记录
    - Item availability 与会话范围安全诊断可见，不把投影问题视为执行失败
    - 修订冲突测试、删除已确认无调用残留，保留旧协议、资源与历史依赖
    - 修正文档、必要 CI 来源布局与八项 AC，进行正常 canonical 现有数据验证
  out_of_scope:
    - 不修改 Runtime、原生协议、数据库 migration、FEAT-152 权限或 local-only raw/high 配置
    - 不恢复 FEAT-137、不新增正文对账、身份猜测、历史重建或自动封口
    - 不复制用户数据库或凭据；不修复旧清理操作、自然过期附件或无绑定任务
    - 无本次真实模型调用授权，不转移 FEAT-132 或原 FEAT-134 历史额度
    - 已授权本轮本地提交及必要pin/修复提交；不推送、打tag、合并或部署。
    - dark theme、Reduce Motion、精确 1180×760 为原 Owner WAIVED / NOT REQUIRED，不是 PASS
  main_flow:
    - canonical 普通入口进入 Chat，沿用现有 app-data 和 Host Home
    - 加载既有历史，旧档案只读、原生来源与缺失信息明确
    - 新原生视图仅由既有安全订阅整份替换，唯一 Native 缓冲追加
    - 显式 phase/plan 分层；reasoning 摘要和正文分别显示
    - 原生 Item 最终对象直接替换，Turn 结束不封口 Item；UI 关闭忙碌并说明缺结束记录
    - 正常会话切换、退出、重启后验证既有历史和资源功能
  visual_direction: 继承 codex-inspired-approximate-parity-v1-2026-08-27 / owner-approved-inference：以 Yijie Design System 和现有 ChatTimeline 为准，最终回答保持最高阅读优先级，commentary/plan/reasoning 使用克制的次级层级与稳定 disclosure；允许颜色、间距、图标和局部布局与 Codex Desktop 合理不同，不依赖任何已撤回截图或版本专属观察。
  ui_states:
    idle: 历史内容可读，不把旧活跃状态当当前执行。
    loading: 显示历史加载反馈，既有正文不被重写。
    success: 原生最终内容、phase、plan 和不同 reasoning 类型可辨；执行和显示可用性分开。
    empty: 不伪造内容、计划或原始 reasoning。
    error: 安全文案说明投影、容量或历史缺失；原生 failed 独立保留。
    retry: 只使用既有协调器入口，不补发任务或猜测接管。
    cancel: Turn 原生 interrupted 保留；未 completed 的 Item 不封口，关闭 UI busy。
must_acceptance:
  - id: AC-001
    statement: 多 Item、Unicode、原生 reasoning 分段仅由唯一 Native 缓冲追加，传输重复只在既有入口处理。
    verification: Native 缓冲及 Host 原生投影定向测试，多 Item/分段/Unicode 与 cursor。
    status: PASS
  - id: AC-002
    statement: commentary/final/plan 仅来自原生字段，缺失不推断。
    verification: 原生 phase/plan 转发和只读 selector 测试；缺失保持 unknown/无 plan。
    status: PASS
  - id: AC-003
    statement: 完整原生 Item 直接替换草稿，接受更短、不同及合法空内容，无正文对账或重复 final。
    verification: 原生缓冲与最终视图值定向测试。
    status: PASS
  - id: AC-004
    statement: Item 与 Turn 生命周期独立，结束不封口 Item，UI 不继续误报忙碌。
    verification: 完成/失败/中断及仅历史加载的组件测试，验证原生事实不变。
    status: PASS
  - id: AC-005
    statement: 执行结果与 availability/诊断分离，投影和存储问题不伪造终态。
    verification: Host warning/原生 terminal、Item availability 和安全诊断测试。
    status: PASS
  - id: AC-006
    statement: summary/raw 分类与原生索引稳定、纯文本、无产品复制按钮，summary-only 不冒充 raw。
    verification: 插入摘要时正文 DOM/identity 不变；summary-only 及纯文本组件测试。
    status: PASS
  - id: AC-007
    statement: 加密已观察事实重开保持来源，冷历史不覆盖原生终态、不猜身份，旧档案可读。
    verification: 复用现有 Native/SQLCipher 正常 reopen 和跨仓集成；canonical 旧历史读取。
    status: PASS
  - id: AC-008
    statement: canonical 正常启动、切换、退出重启，相关展示/a11y 与附件/Artifact/Command/FEAT-152 定向回归通过。
    verification: 安全定向检查和 canonical 现有数据验证；豁免项不作为 PASS。
    status: PASS
