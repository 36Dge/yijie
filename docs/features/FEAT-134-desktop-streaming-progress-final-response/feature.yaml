schema_version: 3
delivery_profile: "demo_fast"
exposure: "local"

feature:
  id: "FEAT-134"
  slug: "desktop-streaming-progress-final-response"
  title: "Desktop 流式响应、过程状态与最终回答分层"
  status: "usable"
  created_at: "2026-08-28"
  requirement_owner: "段成威"
  technical_owner: "段成威"
  reviewer: "段成威"
  release_owner: "段成威"

scope:
  risk_level: "high"
  data_classification: "restricted"
  contract_impact: "semantic"
  database_change: "expand"
  persistence_change: "durable"
  runtime_change: "none"
  auth_permission_change: "none"
  user_workflow_change: "user_visible"
  ui_change: "interactive"
  ai_behavior_change: "model"

repositories:
  - "yijie"
  - "yijie-contracts"
  - "yijie-agent-host"
  - "yijie-desktop"

timebox:
  target_hours: 12
  hard_stop_hours: 16
  no_progress_minutes: 30
  same_blocker_minutes: 90
  non_core_limit_minutes: 120
  core_blocker_minutes: 240

product_ux:
  status: "PASS"
  primary_user: "在易界 AI Desktop 中观察 Agent 实时处理过程、阅读最终回答并在稍后重开对话的本地用户"
  problem: "FEAT-132 已建立 ConversationState，FEAT-133 已建立 Timeline 展示框架，但当前 live projection 将 Assistant 流压成单一文本，并丢失 commentary/final phase、稳定 plan、reasoning 可用性和独立 Item lifecycle；页面无法准确区分等待、过程、推理记录、最终回答及不完整终态，也无法保证这些语义与本地历史重开一致。"
  user_outcome: "用户从 canonical local 入口看到由真实契约事件驱动的流式回答：等待、过程信息、模型推理记录和最终回答层级清楚，完成、失败与中断状态准确，已确认的部分内容不会丢失或重复；重开 Desktop 已持久化的会话后保持同样的顺序、身份和语义。该结果直接服务于完整 Epic 的 Codex-inspired 对话工作区目标，但 FEAT-134 完成不等于 Epic 完成。"
  in_scope:
    - "以固定 Runtime 的稳定 schema 为上游事实，先在 yijie-contracts 建立显式协商的 Agent session event vNext，不静默修改 v1、v2 或 v3"
    - "投影 AgentMessage lifecycle 的 commentary/final_answer/null phase，并投影稳定 turn/plan/updated；明确排除 experimental item/plan/delta"
    - "把受支持的 raw reasoning delta/finalized 与 unavailable/incomplete reason 明确纳入兼容基线；沿用 ADR-0016 的不可信纯文本、Restricted Data 与无产品级复制按钮边界"
    - "仅在 demo_fast/local 将固定 managed provider reasoning effort 设为 high，并启用 Host raw-reasoning projection；不增加用户可选档位，不影响 public/production"
    - "由 yijie-agent-host 按真实 itemId、turnId 与协商版本生成事件，保留 item.completed 与 turn.completed 的不同语义，并升级 Contracts pin"
    - "由 Desktop 私有 IPC、FEAT-132 ConversationState authority 和 SQLCipher history authority 消费、归并并持久化新增语义，不建立页面侧第二份状态机"
    - "在 FEAT-133 ChatTimeline 上呈现等待、commentary/plan、模型推理记录、最终回答、完成、失败、中断、warning/error 与 unknown；最终回答永不默认折叠"
    - "按真实 Item identity 聚合交错 delta，以 authoritative item.completed snapshot 对账，保证不丢字、不重复、不回滚已确认正文"
    - "仅对 Desktop 已观察并成功持久化的事件保证 live/hydration 等价；Host 进程级短窗 replay 不充当产品历史 authority"
    - "长流展示节流、文本选择稳定和动态可访问反馈，以及 light、200% zoom 与键盘基线；只向 FEAT-141 输出真实 active/streaming 信号。Owner 已将 dark theme、Reduce Motion 与精确 1180×760 从 FEAT-134 治理门禁移除，三项均为 WAIVED / NOT REQUIRED，不是 PASS"
    - "保留 FEAT-127 附件、FEAT-128 Artifact 和 FEAT-133 Timeline/clipboard authority，不改变其 identity、存储或 action 边界"
  out_of_scope:
    - "修改、升级、重编译、替换、同步或重新固定 yijie-codex Runtime、binary、schema 或 pin；experimentalApi 必须保持 false"
    - "使用 experimental item/plan/delta、从文本或事件顺序猜测 commentary/final phase、伪造 plan step、时间、百分比或 reasoning 正文"
    - "把 warning 在缺少 turnId 时猜测归因到 active Turn；只能按真实 thread/session authority 呈现"
    - "把 Host 内存 replay 当作跨进程或跨重启历史；错过事件后的复杂恢复、重连和 missing-final 修复属于 FEAT-140/FEAT-142"
    - "新增 Stop/Cancel 控件或定义停止命令；FEAT-134 只消费真实 interrupted/failed 状态，控制能力属于 FEAT-139"
    - "重写 Composer、Sidebar、附件、Artifact、Command/Tool 详情、审批、复杂恢复或长对话虚拟化策略"
    - "引入 React、assistant-ui、第二套 Timeline/状态 authority 或新增依赖；任何确需依赖的提案必须停止并单独获得 Owner 授权"
    - "除 Owner 于 2026-08-28 明确批准的 demo_fast/local 固定 reasoning effort=high 与 Host raw projection 外，修改模型、prompt、Provider、summary 或其它 start-turn reasoning 配置"
    - "自动滚动、阅读位置保持、reader state 或跟随策略；这些能力属于 FEAT-141"
    - "逐像素复制 Codex Desktop、建立版本/build Freeze、使用已撤回人工材料或要求 Owner 补采 Codex 证据"
    - "语音、模型版本信息、模型推理强度配置/档位 UI、分享、切换置顶摘要、显示右侧上下文面板、分支到新聊天"
    - "CAP-022 / GS-006 文件修改与 Diff；既有 Artifact 可以保留，但不得包装或描述为 FileChange/Diff"
    - "除 Owner 明确授权的 canonical 无敏感纯文本验证外，任何额外 Provider prompt、付费调用、生产写入或 public/production 发布；历史 tranche 已消费 4/4，当前追加 tranche 已消费 6/7、剩余 1 次，Feature 累计 10/11；每次均禁止工具/文件读写且不是程序自动重试，历史失败与额度不得覆写"
  main_flow:
    - "用户通过 canonical pnpm tauri:demo-fast:stable 零登录进入 Chat；FEAT-132 ConversationState 是 Timeline 唯一语义输入，页面不读取 raw Host/Runtime wire。"
    - "Turn 开始但尚无正文时，只依据真实 active lifecycle 显示克制的等待反馈；没有真实 plan 或进度值时不生成步骤、时长或百分比。"
    - "Host 按协商的 vNext 发送真实 Item lifecycle、delta、phase、稳定 plan 和受支持 reasoning 状态；Desktop 按 itemId 与内容块索引增量归并。"
    - "Timeline 将 commentary/plan 与模型推理记录作为次级、可折叠过程，将 final_answer 作为主要结果且默认展开；null/unknown phase 使用明确的未分类语义，不猜测成 final。"
    - "item.completed 仅对账对应 Item；即使某 Item 已完成，只要尚未收到 turn.completed，Turn 仍保持 active。"
    - "收到 completed、interrupted 或 failed 的 turn.completed 后，保留所有已确认部分正文并停止流式指示；错误或不完整原因只影响对应范围。"
    - "Desktop 将已观察事件写入 SQLCipher 权威历史；用户重开会话时按相同 identity、ordinal、kind、phase、content 与 status hydration，不重复 final。"
    - "FEAT-127 附件与 FEAT-128 Artifact 继续从既有 authority 进入 Timeline；本 Feature 收口时只声明 FEAT-134 能力完成，完整 Epic 继续由后续 Feature 收口。"
  visual_direction: "继承 codex-inspired-approximate-parity-v1-2026-08-27 / owner-approved-inference：以 Yijie Design System 和现有 ChatTimeline 为准，最终回答保持最高阅读优先级，commentary/plan/reasoning 使用克制的次级层级与稳定 disclosure；允许颜色、间距、图标和局部布局与 Codex Desktop 合理不同，不依赖任何已撤回截图或版本专属观察。"
  ui_states:
    idle: "Thread 已加载且没有 active Turn；历史内容、Item identity、phase 与终态保持稳定，不显示流式光标或虚假处理状态。"
    loading: "初次 hydration 使用稳定 skeleton；已有内容刷新时保留已确认正文，不闪成空白，也不把 loading 当作 Agent 过程。"
    success: "真实 commentary/plan/reasoning 与 final 分层显示；最终回答默认展开，完成状态不只依赖颜色，item.completed 不抢先结束 active Turn。"
    empty: "无消息时显示明确的开始任务提示，不生成示例过程、plan、reasoning 或 Assistant 消息；Composer authority 不变。"
    error: "turn-correlated error、thread-scoped warning、unknown phase、reasoning unavailable/incomplete 和 failed Turn 依据各自 authority 显示脱敏文案；已确认内容继续可读。"
    retry: "只有既有上层 authority 提供安全恢复意图时才显示恢复入口；Timeline 组件不直接调用 Host、Tauri 或网络，复杂 resync 留给 FEAT-140/FEAT-142。"
    cancel: "本 Feature 不新增停止控件；收到真实 interrupted 终态时保留 partial content、移除流式指示并显示不完整状态，实际 Stop action 属于 FEAT-139。"

must_acceptance:
  - id: "AC-001"
    statement: "多个 Assistant Item 或内容块的 Unicode delta 按真实 itemId、block index 与 sequence 确定性聚合；交错、重复或批量发布后不丢字、不重复、不串 Item。"
    verification: "Contracts/Host fixture 与 Desktop adapter/reducer 测试覆盖多 Item 交错、Unicode 边界、重复 event_id、sequence gap 和批量 envelope；核对每个稳定 identity 的完整正文。"
    status: "PASS"
  - id: "AC-002"
    statement: "commentary、稳定 plan、模型推理记录与 final_answer 只依据显式投影分层；null/unknown phase、缺失 reasoning 或缺失 plan 不通过字符串、位置或时序推断。"
    verification: "vNext schema/compatibility tests、Host mapping tests、Desktop parser/reducer/Timeline tests和安全 negative fixtures；确认 experimental item/plan/delta 被拒绝或忽略。"
    status: "PASS"
  - id: "AC-003"
    statement: "authoritative item.completed snapshot 与已累计 delta 对账后仅保留一份内容，不回滚已确认文本；turn.completed 不再生成重复 final。"
    verification: "覆盖 snapshot 等于、长于、短于或冲突于累计 delta 的 reducer 状态表，并以稳定协议规则处理 gap/conflict；重开历史核对 final 唯一。"
    status: "PASS"
  - id: "AC-004"
    statement: "item.completed 只结束对应 Item；Turn 在真实 turn.completed 前保持 active，首个 delta 前显示真实等待态且不伪造步骤、百分比、耗时或流式正文。"
    verification: "Host lifecycle fixture、Desktop private projection 与 ConversationState 测试覆盖 Item 先完成而 Turn 继续、无 delta active 和多个 Item 生命周期。"
    status: "PASS"
  - id: "AC-005"
    statement: "completed、interrupted 与 failed 终态准确区分；interrupted/failed 保留已确认 partial content 并标记不完整，错误或 warning 不擅自封口 Turn。"
    verification: "确定性 lifecycle/notice fixture 与 reducer/Timeline 测试；不强杀、不故障注入、不破坏权限、不替换 binary，并仅消费安全合成状态或已有无敏感历史。"
    status: "PASS"
  - id: "AC-006"
    statement: "模型推理记录遵守 ADR-0016：仅显示受支持 raw reasoning 的不可信纯文本；complete/incomplete/unavailable 与 reason code 准确，缺失正文不由 final、工具输出、模板或元数据冒充。"
    verification: "Contracts vNext negotiation、Host flag/mapping、Desktop persistence/renderer tests；核对无 Markdown/HTML/链接激活、无产品级复制按钮、无日志/遥测/审计/错误正文泄漏。"
    status: "PASS"
  - id: "AC-007"
    statement: "对 Desktop 已观察并成功写入 SQLCipher 的事件，live 与重开 hydration 在 identity、ordinal、kind、phase、content、status 与 reconciliation 结果上语义等价且没有重复 final。"
    verification: "数据库 expand/migration、snapshot/hydration 与 restart tests；明确区分 Desktop durable authority 和 Host process-local replay，不宣称恢复从未被 Desktop 观察的事件。"
    status: "PASS"
  - id: "AC-008"
    statement: "长流采用不丢事件的展示节流，文本选区不被流式装饰改写，布局无明显抖动且动态反馈不过度播报；light、200% zoom 与键盘下无关键阻塞。dark theme、Reduce Motion 与精确 1180×760 已由 Owner 从本 Feature 门禁移除，状态为 WAIVED / NOT REQUIRED，不作为 PASS claim。"
    verification: "长流 reducer/component performance fixture、selection/aria-live/layout-stability tests，加 canonical local 的 light、200% zoom 与键盘 smoke；自动滚动与 reader state 留给 FEAT-141。dark theme、Reduce Motion 与精确 1180×760 无需执行或恢复系统设置；Yijie 本地 Artifact 不充当 Codex reference evidence。"
    status: "PASS"

