feature:
  id: "FEAT-150"
  slug: "desktop-my-stores-page"
  title: "Desktop 我的店铺展示页"
  status: "usable" # draft | active | usable | blocked
  created_at: "2026-08-26"
  requirement_owner: "段成威"
  technical_owner: "段成威"
  reviewer: "段成威"
  release_owner: "段成威"

scope:
