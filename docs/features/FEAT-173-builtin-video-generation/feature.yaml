    - 公开发布、Git提交推送和历史数据迁移清理
  main_flow:
    - 普通聊天表达生成意图并可附图片；有专家则保持专家路径
    - 原生发现视频MCP；Host先核验本轮、专家和输入
    - 使用已有root ID持久预占，同聊天有未决则拒绝新创建；返回原操作引用
    - 原生继续执行按原任务查询；一次交付后只查现有Artifact，不重建ACK或spool
    - Native本地提交ready后显示可播放保存的视频，ACK另用于Host交付确认；停止只停止本地等待发布
  visual_direction: 沿用现有工具活动和MP4卡片，不新增任务中心、播放器或参数面板
  ui_states:
    idle: 原输入框和图片附件
    loading: 真实原生工具活动及排队运行状态，无虚构百分比
    success: Native提交后用现有视频播放器和保存
    empty: 无有效输入则创建前拒绝；无产物不冒充交付
    error: 区分输入、运营资格、供应商失败未知与交付失败
    retry: 只查原任务或读取已有产物；不自动重POST
    cancel: 停止本地等待和迟到发布，报告远端可能继续及费用未知
