      reason: 复用历史并保存必要服务端调用记录
    notification:
      status: required
      reason: 原生MCP与审批投影
    replay:
      status: required
      reason: 只读历史不能触发新外部执行
    terminal:
      status: required
      reason: 取消、结果和unknown归属原操作
    cleanup:
      status: required
      reason: 正常EOF、有限HTTP owner收尾，无强杀
