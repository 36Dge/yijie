product_ux:
  status: "PASS"
  primary_user: "负责把易界 Desktop 对话工作区与冻结 Codex Desktop 行为对齐的产品、设计、开发和验收人员，以及最终使用易界 Agent 对话完成任务的本地用户"
  problem: "“与 Codex Desktop 一致”尚未被固定为版本化、可复核、可回放的行为基线，后续 Feature 无法区分 Desktop 缺口、Host/Contracts 缺口、固定 Runtime 上限和主动产品差异。"
  user_outcome: "在保留 Vue 技术栈和固定 yijie-codex Runtime 不变的前提下，后续 FEAT-132–143 可引用同一冻结版本、能力矩阵和脱敏黄金场景，逐步交付与 Codex Desktop 可观察行为一致的端到端对话体验。"
  in_scope:
    - "冻结 Codex Desktop 26.818.61809 build 7019、日期、环境和证据状态"
    - "冻结 Runtime 0.144.6、fork/upstream commit、schema tree 与 experimentalApi=false"
    - "建立 Codex 行为到 Runtime、Host/Contracts、Desktop 和 Owner Feature 的能力矩阵"
    - "定义至少 13 个正常、失败、中断、恢复和长对话黄金场景及证据来源"
    - "建立不进入生产 bundle 的 Desktop test-only 确定性事件回放与敏感数据扫描"
    - "对无法安全自动观察的参考交互如实标记 reference-unobserved"
    - "提供固定 MiniMax 文本 Provider、关闭图片动态工具且 experimentalApi=false 的 canonical Desktop local 验证入口"
    - "canonical stable 入口使用独立 bundle identifier、Desktop app-data 与 Host/Codex home，避免恢复默认 demo_fast 的历史 outbox"
  out_of_scope:
    - "任何生产 Chat UI、路由、Tauri command、Host API、公共 wire 契约或持久化行为变化；仅增加 local 验证 launcher 与既有 Provider 环境的受限 Sidecar 投影"
    - "修改、升级、重编译或同步 yijie-codex Runtime、binary、schema 或 pin"
    - "开启 experimentalApi 或伪造当前 Host/Runtime 不具备的 Command、Tool、Approval、Diff、Steer 事件"
    - "复制 Codex Desktop 源码、品牌素材、私有文案或逐像素视觉实现"
    - "决定高风险审批、文件写入或其他权限策略"
    - "public/production 发布、签名、公证、部署或外部写入"
    - "修改 yijie-agent-host 的 Runtime 管理器或验证其超时/协议失败强制 Kill fallback；该跨进程风险只登记限制，不做故障注入"
  main_flow:
    - "实施者核对本机参考 App、固定 Runtime 和当前 Host/Contracts/Desktop 的只读事实，并记录证据来源与不可观察项。"
    - "实施者把每项行为映射到四种 primary capability classification、交付层和 Owner Feature。"
    - "实施者用无真实正文、路径、秘密、PII 或商家数据的 fixture，通过真实 Desktop parser/store 运行 test-only 回放。"
    - "实施者通过 pnpm tauri:demo-fast:stable 启动独立 identifier/data-root 的 freshly built debug App，先核对 Runtime/Provider/readiness 与 experimentalApi=false；真实 prompt 只有在另获未使用授权时才可提交。"
    - "Owner 审核后冻结该基线；后续参考 App 更新只登记 drift，不静默改写本基线。"
    - "FEAT-132–143 复用场景 ID 和矩阵逐步实现完整 Epic，总目标在本 Feature 单独完成后仍未达成。"
  visual_direction: "不修改生产 UI。Codex Desktop 截图/录屏仅作为脱敏内部参考；测试渲染若后续需要，必须使用既有易界 token、组件和 light/dark/minimum-window 规范。"
  ui_states:
    idle: "等待执行只读基线采集或确定性回放；生产 UI 无变化。"
    loading: "正在读取版本元数据、核对 manifest 或执行有界内存回放，不显示或写入真实用户内容。"
    success: "版本冻结、能力矩阵、场景、证据索引、Runtime 对账和回放检查均有可复核结果。"
    empty: "参考行为无法安全观察时明确标记 reference-unobserved，并记录原因、影响和 Owner，不生成替代观察。"
    error: "记录稳定的检查失败、受影响 AC 和恢复建议，不写绝对路径、用户正文、secret、PII 或商家数据。"
    retry: "只重跑安全、幂等、确定性的读取、扫描、测试和正常启动检查，不通过故障注入制造结果。"
    cancel: "仅使用工具或应用自身的正常取消、退出和清理流程；保留已生成证据，禁止强杀进程。"

