    verification: "compatibility manifest、Runtime manifest/checksum 与只读 HEAD/status 对账。"
    status: "PASS"
  - id: "AC-003"
    statement: "至少 13 个黄金场景均记录前置条件、用户操作、状态顺序、可用动作、最终结果、provenance 和观察状态；无法获取的场景明确为 reference-unobserved。"
    verification: "黄金场景表审查与 fixture/场景 ID 一致性测试。"
    status: "PASS"
  - id: "AC-004"
    statement: "每项能力使用四种 primary classification 之一并指定交付层、阻断原因和 Owner Feature，不把实现存在误写为权威 supported projection。"
    verification: "capability matrix 枚举、owner 覆盖和分类词表检查。"
    status: "PASS"
  - id: "AC-005"
    statement: "fixture 不含真实 prompt、绝对路径、secret、token、PII、手机号、邮箱、私钥或商家数据，并标明 reference-observation、real-runtime 或 synthetic provenance。"
    verification: "fail-closed fixture parser、canary/no-sensitive-data focused test 与人工审阅。"
    status: "PASS"
  - id: "AC-006"
    statement: "test-only 回放使用真实 Desktop wire parser/store，可重复运行；生产 bundle 不包含 fixture、回放 harness、canary、测试路由或 viewer。"
    verification: "focused Vitest、连续重复回放、production build 与 dist boundary scanner。"
    status: "PASS"
  - id: "AC-007"
    statement: "Codex Desktop 更新或本机版本漂移时仍保留 26.818.61809 build 7019 冻结基线，除非 Owner 明确建立新 baseline。"
    verification: "版本漂移 focused test、基线变更规则和证据索引审查。"
    status: "PASS"
  - id: "AC-008"
    statement: "yijie-codex Runtime 仓库、schema tree 和 compatibility pin 在实施前后无变化。"
    verification: "实施前后 git HEAD/status、schema tree hash 和 manifest 精确对账。"
    status: "PASS"
  - id: "AC-009"
    statement: "存在隔离的 canonical Desktop local 验证入口；它保留 MiniMax-M3 文本 Provider、关闭 FEAT-128 图片动态工具，以 experimentalApi=false 初始化固定 Runtime；stable-only 第二实例 fail closed，Desktop supervisor 不使用 kill_on_drop/start_kill。"
    verification: "launcher/package/config focused test、Sidecar Provider/Desktop-cleanup policy Rust 正向测试、Host /v1/status 只读探针、隔离 identifier 的注册 .app UI 启动与应用自身 Cmd-Q 退出。Host 内部 Runtime fallback 不在本 AC 的 PASS 声明内。"
    status: "PASS"

