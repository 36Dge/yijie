product_ux:
  status: PASS
  primary_user: 安装易界后直接用普通聊天处理文档的用户
  problem: 现有准入预览不保证普通聊天有可运行的生成依赖，市场专家能力不能成为默认文档环境
  user_outcome: 无需开发工具或选择专家技能连接器即可生成解析预览九格式，并在后续对话修改和另存可追溯原件
  in_scope:
    - TXT、Markdown、HTML、CSV、JSON、DOCX、PPTX、XLSX、PDF创建解析修改预览导出
    - 独立于现有可选市场资源的内建指南模板脚本与工具入口
    - 应用专用CPython单栈文档库LibreOffice和Quartz页面导出字体，版本固定且绝对路径调用
    - 原生执行审批view_image与现有publisher至Native提交ACK和预览保存链复用
    - 清洁安装候选、正常升级兼容回退、来源许可与版本化交付
  out_of_scope:
    - 图片视频独立生成产品，文档插图及内部页面PNG校验仍在范围内
    - 云协作OpenAI Spaces账号完整CRDT编辑器和完整Office克隆
    - 宏VBA执行PDF OCR任意格式互转及未声明平台
    - 公网付费用户多租户生产激活正式签名发布
  main_flow:
    - 完整安装候选启动并独立核验环境，本地验收沿既有免登录固定scope
    - 普通聊天直接提需求或上传文件，原生机制发现并按需读取内建指南
    - 专用引擎创建新版本，结构内容检查后渲染，原生view_image检查适用页图
    - 原publisher登记Host暂存Native校验提交ACK，显示真实就绪产物
    - 右栏阅读同一版本，原权限另存，后续编辑产生新版本并保留旧引用
    - 模型只凭同generation匹配ACK确认committed，重启unknown不重放；7天保留到期提示，另存原件独立存续
  visual_direction: 沿原聊天活动产物卡片和右栏，不新增文档模式或技术配置要求；保持亮暗最小窗键盘和阅读位置
  ui_states:
    idle: 原输入框，无模板时合理默认，不强制市场能力或模板选择
    loading: 真实执行校验交付状态，无事件不造百分比，旧提交版本可读
    success: 真实产物卡和正文，生成提交和桌面另存分别确认
    empty: 零字节按原publisher拒绝并明确无可交付内容，不加换行造文件；非零合法空容器正常解析，不冒充读取失败
    error: 明确环境生成结构预览或保存失败，保留原件及其他成功格式
    retry: 用户明确操作或新增证据后重试失败环节，同版本幂等，未知结果先查询
    cancel: 原生cooperative_only策略正常收尾；30秒未退出STOP_PENDING并保有句柄，不强杀/假完成；未资格不启用文档执行
