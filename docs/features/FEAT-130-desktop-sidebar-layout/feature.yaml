product_ux:
  status: "PASS"
  primary_user: "在易界 AI Desktop 中新建任务、选择本地项目并回看本地对话的用户"
  problem: "主导航顺序、独立任务记录页面和项目树位置增加了导航成本，且项目选择条层级偏弱。"
  user_outcome: "用户可从固定顺序的左侧导航直接按项目浏览对话，并在更清晰的项目选择条中开始任务。"
  in_scope:
    - "主导航顺序调整，包含资料库后再显示任务记录"
    - "任务记录静态分组、项目到对话两层树与独立滚动区"
    - "移除 /tasks 独立页面、页面布局和导航关系"
    - "保留 removed project session 的安全可发现性"
    - "主页项目选择条 radius-lg 与 bg-app 视觉调整，hover 不增加描边"
    - "相关测试、视觉验证与设计规范 override"
  out_of_scope:
    - "公共或私有 IPC、API、Runtime、数据库和重放契约变化"
    - "恢复已移除项目的真实名称或路径"
    - "实现我的店铺、工作台、定时任务、插件或资料库业务页面"
    - "公开部署、生产发布、签名、公证和自动更新"
  main_flow:
    - "用户通过 demo_fast local 零登录入口进入 Desktop。"
    - "主导航按新建任务、我的店铺、工作台、定时任务、插件、资料库、任务记录显示。"
    - "用户在任务记录下展开项目并选择对话，进入 /chat/:sessionId。"
    - "长列表只在任务记录树滚动；主页项目选择条以增强后的 token 样式选择项目。"
  visual_direction: "遵循 yijie Desktop Design System，使用现有语义 color/radius/spacing token、YjIcon、light/dark 与标准密度。"
  ui_states:
    idle: "固定主导航和可展开项目/对话树；主页显示增强后的项目选择条。"
    loading: "任务树内部显示正在读取本地任务，固定导航不位移。"
    success: "项目与对话层级清晰，点击对话进入对应 Chat。"
    empty: "任务树显示暂无任务记录。"
    error: "稳定中文错误或权限提示，不泄漏路径、ID 或底层错误。"
    retry: "复用现有 Chat store 的恢复动作，不新增旁路请求。"
    cancel: "N/A：没有新增可取消操作；现有确认弹窗语义不变。"

must_acceptance:
  - id: "AC-001"
    statement: "主导航顺序精确为新建任务、我的店铺、工作台、定时任务、插件、资料库、任务记录，设置仍固定在底部。"
    verification: "导航单测与 1180×760 视觉截图。"
    status: "PASS"
  - id: "AC-002"
    statement: "任务记录是非导航静态分组，标题不改变路由，/tasks 页面、loader 与 route 均不存在。"
    verification: "组件/路由单测与 source inventory。"
    status: "PASS"
  - id: "AC-003"
    statement: "任务记录第一层是项目、第二层是对话；点击对话进入 /chat/:sessionId，已移除项目历史仍显示为项目已移除。"
    verification: "Tree focused tests 与真实 renderer smoke。"
    status: "PASS"
  - id: "AC-004"
    statement: "长任务列表仅在任务记录区域纵向滚动，不推动顶部导航或底部设置离开可视区域。"
    verification: "1180×760 长列表视觉截图。"
    status: "PASS"
  - id: "AC-005"
    statement: "主页项目选择条圆角从 8px 增至 12px，未 hover 背景保持轻微对比；hover 不增加描边，focus 与 light/dark 均清晰。"
    verification: "token source check 与 light/dark 截图。"
    status: "PASS"
  - id: "AC-006"
    statement: "核心导航和历史选择保持键盘可用，无严重/致命 axe 问题，200% zoom 与 reduced-motion 不遮挡关键操作。"
    verification: "focused accessibility 与视觉矩阵。"
    status: "PASS"

