  primary_user: 易界每次对话的用户
  problem: 正式答案前缺少连贯公开进度且主线堆执行日志，样本存在重复无效执行和空答结束
  user_outcome: 复用Codex原生机制产生并及时显示任务相关过程，交付正式结果并可完整回看
  in_scope: [原生公开消息, 工具结果闭环与收敛, 跨层消息保真及时序, 分段工具摘要与展开明细, 原生文件动作和App上下文安全投影, 入口与历史兼容]
  out_of_scope: [新进度模型或引擎, Host自建推理循环, 默认Runtime升级, 历史补造, 独立检索系统重做, 公开发布]
  main_flow: [既有入口开始Turn, 原生公开说明与有效工具活动, 真实中途推进说明, 正式结果独立呈现, 正常重开回看]
  visual_direction: 自然语言过程穿插淡色可展开的分段工具摘要，本段操作及单项详情可查，推理与协议诊断另置
  ui_states:
    idle: 等待输入而不虚构进度
    loading: 真实活跃观察驱动单一等待位，公开正文到达即显示
    success: 正式结果可读，过程默认收起且用户选择优先
    empty: 普通问答未收到结果时准确说明，不把推理或commentary当final
    error: 现有失败和可用性状态如实保留，需行动事项可见
    retry: 复用已有明确用户操作及幂等回执，不新增自动追问
    cancel: 原生interrupt正常停止，保留部分内容并停止动画
