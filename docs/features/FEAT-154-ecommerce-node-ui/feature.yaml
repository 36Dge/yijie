  slug: ecommerce-node-ui
  title: 电商节点前端 UI
  status: in_progress
  created_at: 2026-09-15
  requirement_owner: 段成威
  technical_owner: 段成威
  reviewer: 段成威
  release_owner: 段成威
request_boundary:
  owner_scope_reaffirmation: 整个FEAT-154仅在工作流中注册30个电商节点并实现画布展示、属性表单和页面内交互；不实现节点接口调用逻辑，不实现任何节点业务处理逻辑。
  owner_test_run_clarification: 试运行入口保持可点击；点击仅展示未接入提示，不进行接口调用或业务处理，也不生成模拟运行结果。canTest只表示实际执行资格，不驱动纯展示入口禁用。
  current_delivery: local_commit_baseline
  implementation_authorized: true
  current_change_contract_impact: none
  note: 用户已授权逐仓本地提交及Contracts完整SHA固定；实现完成，验收未全部完成。现存App是此前验收构建，本轮未重建激活。浅色1180×760为历史通过项；1440×900及暗色NOT RUN，AC-009 pending、D4 NOT RUN。
