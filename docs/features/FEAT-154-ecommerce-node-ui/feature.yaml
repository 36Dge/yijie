  core_blocker_minutes: 240
product_ux:
  status: PASS
  primary_user: 使用易界工作流画布的跨境电商卖家
  problem: 现有Coze原生画布只有三节点受限目录，缺少已定义30电商节点UI
  user_outcome: 从原添加节点面板查找并添加30类节点，在原生卡片/侧栏配置输入与业务配置、查看只读输出定义
  in_scope:
    - 官方Coze NodePanel/NodeList复用和30节点静态目录、简单分组/搜索
    - 节点卡片、选中/移动/删除、原生属性侧栏
    - 全部299输入、64独立配置、271输出顶层字段及明示嵌套结构
    - 卖家中文标签、类型/必填/明示枚举/建议默认值与未配置状态
    - 页面内存UI设计状态、原草稿保护、明确离开提示；不持久保存
    - 用户确认页面离开提示，关闭窗口/退出App/刷新重启不保证保留；不新增native退出协议
  out_of_scope:
    - Git推送、生产或公网部署
    - Markdown处理逻辑、业务结果、错误码与平台业务分支
    - 业务API/模型/媒体上传下载/数据抓取/审核/发布/发送
    - 新节点可执行图、保存落库、运行调度、公共业务Schema
    - 跨重启恢复、账号权限/Runtime改变、公网与生产
  main_flow:
    - 已有canonical Desktop → /workflows → 同窗口原生Coze画布
    - 点击添加节点→官方面板静态分组/搜索→选择节点
    - 卡片出现并选中→侧栏输入/业务配置/输出
    - 同页切换/历史modal保留设计→页面离开确认或明确恢复原稿；新图不发保存/执行请求，App关闭不保证保留
  visual_direction: 沿用当前原生布局与易界工作流主题，局部青柠#B7F03D，浅画布#F2F3F5；PDF只参考结构控件，卖家中文标签优先
  ui_states:
    idle: 目录/画布/选中卡片与属性栏明确
    loading: 仅前端组件加载，有返回入口，不表示业务执行
    success: 已添加或界面配置更新，不表示业务成功
    empty: 无匹配/未填写/无引用候选均可恢复
    error: 普通格式错误或组件错误就地提示，不使用业务错误码
    retry: 修正输入或重试前端组件，不重发业务接口
    cancel: 面板关闭不丢值；应用内页面离开确认，取消保留；恢复原稿只放弃设计。窗口/App退出不保证保留（用户已明确选择）
must_acceptance:
  - id: AC-001
    statement: 原“添加节点”打开 Coze 官方面板；30 个节点名称一一对应、无重复遗漏，分组及本地搜索可用
    verification: 逐项对照 04，清空/命中/无结果搜索与源码复用核对
    status: pass
  - id: AC-002
    statement: 30 种节点均可点击添加、选中打开侧栏；同类可添加独立实例；卡片显示正确标题、图标及输入/输出摘要
    verification: 逐节点实际点击；两份同类配置互不影响；拖动/删除/取消正常
    status: pass
  - id: AC-003
    statement: 节点 1–8 输入、业务配置、输出全部覆盖，类型/必填/显式枚举/建议默认值与原文一致
    verification: 对照 04 全部字段行，默认值逐项审阅，普通格式错误修正
    status: pass
  - id: AC-004
    statement: 节点 9–30 输入/输出全部覆盖；输入内配置对象按子项展开；不伪造无依据的必填、枚举、默认值
    verification: 对照 04 全部字段及嵌套描述，覆盖模式、平台展示、列表/对象/媒体引用
    status: pass
  - id: AC-005
    statement: 中文业务标签、简短帮助及分组控件，变量名/类型可辅助查看；输出只读，无 JSON 大框作为唯一配置入口
    verification: 审阅复杂节点 3/8/10/15/17/22/26/30；输出无伪造结果或状态
    status: pass
  - id: AC-006
    statement: 表单仅更新页面内状态，切节点/侧栏/历史保留；页面离开确认，恢复原稿不覆盖进入前未保存内容；App退出/刷新重启不保证保留且不承诺恢复
    verification: 正常切换、关闭、取消离开/明确放弃；原草稿及历史不被覆盖
    status: pass
  - id: AC-007
    statement: 新节点不发业务接口、不解析/上传/下载素材、不执行工作流；新 UI 内容不进入保存/试运行/发布请求或历史
    verification: 源码及正常UI请求观测，新图不进入业务请求；既有初始化读与历史显式运行原版本单独记账，不据designDirty禁掉原能力
    status: pass
  - id: AC-008
    statement: loading/empty/error/retry/cancel/只读状态明确；普通错误修正后可继续，重复打开无重复实例或串值
    verification: 正常输入、清空搜索、前端重试和取消；不注入故障或攻击
    status: pass
  - id: AC-009
    statement: 沿用当前主题与原生组件；浅/暗色在 1180×760、1440×900 下长表单可滚动，焦点可见、键盘可用
    verification: 主题/尺寸截图；Tab/Enter/Esc、侧栏滚动、长名称/数组/对象检查
    status: pending
  - id: AC-010
    statement: 同一正常 Desktop 产品入口真实可操作；既有三节点边界与用户主题改动保持，验证如实记录
    verification: 最终 diff、正常入口 UI fresh run、聚焦构建检查；禁止项 NOT RUN，外部调用 0
    status: pass
