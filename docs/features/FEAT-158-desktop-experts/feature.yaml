product_ux:
  status: PASS
  primary_user: 需要京东运营操作建议的易界卖家
  problem: 重复描述专家角色和知识背景，缺少可持续选用的专业会话入口
  user_outcome: 在扩展中召唤京东专家，同一对话持续咨询，引用可追溯，并能移除恢复普通模式
  in_scope:
    - 扩展入口和技能专家双Tab，原技能功能保留
    - 首个资深电商运营操盘手，明确京东专向
    - 详情快捷问题、召唤、单专家会话绑定与胶囊移除
    - 复用受管Skills资产、原生会话切换和SQLCipher outbox
    - 复用现有受管知识的按需读取、版本身份和来源定位机制
  out_of_scope:
    - AC-007内容质量验收依2026-10-13用户明确指令移除，不再作为FEAT-158或D4完成门槛；历史评分保留，见13
    - 外观验收按用户指令跳过；继续原FEAT-158剩余需求，逻辑优先，仅补必要真实调用，不扩增评测集或平台业务操作
    - 任意第三方插件导入、多专家团队、自动经营和自动转交
    - 独立专家执行器、第二安装器、新RAG或私有知识摄取
    - 自动连接器授权、自动继承到定时计划、云同步和公开发布
  main_flow:
    - canonical本地入口免登录进入扩展，默认技能，切到专家
    - 详情或卡片召唤，受管资源就绪后回正确对话草稿，不自动发送
    - 用户发送，原有事务冻结专家版本与绑定revision，经Host与固定Runtime执行
    - 会话持续使用专家，移除后下一轮恢复普通指令，历史保留
  visual_direction: 复用技能页和易界主题组件，胶囊放店铺授权右侧，保持当前连接器菜单和行内前缀
  ui_states:
    idle: 浏览搜索和详情不产生模型调用
    loading: 准备中保留原界面，操作互斥，不提前宣告加载成功
    success: 正确草稿出现专家胶囊，正文附件模型保持，输入框获得焦点
    empty: 无条目或搜索零结果明确显示并可清除搜索
    error: 显示原因和重试返回入口，保留草稿和旧有效绑定
    retry: 先查询原操作；绑定与资源提供明确的原操作恢复入口，消息仍沿原快照且不自动重发
    cancel: 取消待选意图或关闭详情，已安全准备资源可留缓存但不自动选用
must_acceptance:
  - id: AC-001
    statement: 扩展入口双Tab和默认技能正确，原技能功能保留，首期一名专家
    verification: 02-verification.md T01
    status: pass
  - id: AC-002
    statement: 卡片详情快捷问题一致，京东能力边界和真实元数据准确
    verification: 02-verification.md T02
    status: pass
  - id: AC-003
    statement: 召唤幂等准备资源并返回正确草稿，不丢内容或自动发送
    verification: 02-verification.md T03
    status: pass
  - id: AC-004
    statement: 单会话单专家持续生效，其他会话隔离，活跃或未知投递时阻止切换
    verification: 02-verification.md T04
    status: pass
  - id: AC-005
    statement: 胶囊位置和移除操作正确，普通模式真实恢复，历史保持
    verification: 02-verification.md T05
    status: pass
  - id: AC-006
    statement: 复用同一原生执行和审批链，专家不扩权或污染全局技能，不隐式选连接器
    verification: 02-verification.md T06
    status: pass
  - id: AC-008
    statement: 绑定快照回执重开可恢复，版本不自动升级，未知结果不重复发送，旧历史可读
    verification: 02-verification.md T08
    status: pass
  - id: AC-009
    statement: 所有关键界面状态可恢复，权限不足不扩权，正常重试和资源移除不丢草稿
    verification: 02-verification.md T09
    status: pass
  - id: AC-010
    statement: 键盘交互可用，同一最终构建的一次真实fresh run覆盖AC-001至006、008、009和正常失败恢复；不包含已移除的AC-007，外观验收跳过且不计PASS
    verification: 02-verification.md T10 与 14-final-engineering-acceptance.md
    status: pass
