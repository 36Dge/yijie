  core_blocker_minutes: 240

product_ux:
  status: "PASS"
  primary_user: "在易界 AI Desktop 中发起、查看、切换和恢复本地 Agent 对话的用户，以及后续 FEAT-133–143 的实现者"
  problem: "当前历史快照、Rust live projection、WebView 事件与 Pinia 分别解释 Turn/Item 状态，流式正文使用单一缓冲区，缺少稳定 Item identity、最终对账和可重复重放边界；后续交互若继续旁路扩展会产生串写、重复和错误终态。"
  user_outcome: "固定 yijie-codex Runtime 不变时，普通文本对话仍可使用；历史、实时事件和恢复结果统一进入一个确定性领域状态机，界面准确显示执行与终态，并为后续 Codex 风格近似交互提供唯一状态来源。"
  in_scope:
    - "建立与 Vue、Tauri 和 wire 解耦的 Thread、Turn、Item、ContentBlock 领域模型与 canonical serialization"
    - "为当前 Desktop 可表达的 user/assistant/reasoning/artifact/unknown Item、Turn progress lifecycle 与 error/warning notice 建立显式、封闭且脱敏的分类"
    - "以 sessionId/threadId、turnId、itemId 关联 live delta、历史 snapshot 和 item.completed reconciliation"
    - "按 eventId 去重、按共享 stream/sequence 检查领域与 cleanup 辅助事件连续性，并把 gap 或非法迁移收敛为 recovery_required"
    - "让普通 error/warning 保持非终态，只允许 turn.completed 权威封口 Turn，并原子封口同 Turn 未完成 Item"
    - "保留 FEAT-127 附件为 user message ContentBlock，复用 FEAT-128 Artifact authority，保留 FEAT-130 selection/authorization epoch 隔离"
    - "仅在生产投影确实需要时，source-first 扩展 Desktop 私有 IPC；不修改中央 Contracts、Host 或 Runtime"
    - "复用 FEAT-131 reference policy codex-inspired-approximate-parity-v1-2026-08-27；不要求人工 Codex 证据或逐像素一致"
  out_of_scope:
    - "修改、升级、重编译、替换或同步 yijie-codex Runtime、binary、schema 或 compatibility pin"
    - "修改 yijie-agent-host 或中央 yijie-contracts；若实现证明不可避免则停止并重新治理，不在本 Feature 越界修改"
    - "新增或迁移 SQLite schema；不为未来 command/tool/approval 建立第二份持久化正文 authority"
    - "Command、Tool、Approval、Diff 卡片、具体 Timeline 视觉、滚动策略和复杂断线恢复 UI"
    - "Owner 主动排除的 GS-006 文件修改与 Diff，以及语音、模型版本、模型推理强度、分享、置顶摘要切换、侧边面板、分支到新聊天"
    - "把 unknown wire 原文透传到 UI，放宽既有 private IPC exact parser，或伪造 Host 未投影能力"
    - "模型、prompt、Provider、Agent 决策、experimentalApi、云端同步、生产发布、签名或外部写入"
  main_flow:
    - "应用绑定本地授权上下文并选择 session；selection token 由 authorization revision、context、session 与 epoch 共同约束。"
    - "subscribe-before-resync；历史 snapshot 先经 adapter 规范化并按稳定 identity hydrate 到领域状态。"
    - "live 事件经 private IPC exact parser 和领域 adapter 转为脱敏 normalized event，再由唯一 reducer 消费。"
    - "reducer 将 delta 写入对应 turnId+itemId，去重 event、检查 sequence，并由 item.completed 对账内容。"
    - "warning/error 只产生非终态 notice；turn.completed 到达后原子封口 Turn 与未完成 Item，终态 resync 原子合并而不重复正文。"
    - "切换 A→B 后，A 的迟到 history/live/artifact/draft 结果因 token 不匹配被丢弃。"
    - "后续 FEAT-133–143 复用该模型扩展展示；FEAT-132 单独完成仍不代表 Epic 完成。"
  visual_direction: "不新增页面、视觉资产或第二套 UI；继续使用现有 Vue/Pinia/Naive UI 和易界 token。可观察变化仅限流式、错误、恢复和终态显示更准确，light/dark 与 1180×760 现有布局不得回归。"
  ui_states:
    idle: "Thread 已 hydrate 且没有 active Turn，composer 按既有权限与 readiness 决定是否可发送。"
    loading: "正在读取历史或原子 resync；已确认的安全内容保持可读，不以空白状态覆盖。"
    success: "Turn 仅在权威 turn.completed 后进入 completed/interrupted/failed，消息与 Item 不重复。"
    empty: "新 Thread 没有 Turn/Item 时沿用明确空状态，不生成占位正文。"
    error: "显示固定、脱敏且可恢复的 diagnostic code；普通 error/warning 不擅自封口 Turn。"
    retry: "sequence gap、非法迁移或 parser failure 进入 recovery_required，并只通过既有安全 resync/recovery 意图恢复。"
    cancel: "用户中断沿用正常 interrupt 流程，保留已确认内容；不通过强杀或故障注入制造状态。"

must_acceptance:
  - id: "AC-001"
    statement: "同一 normalized snapshot 与事件序列重放多次，产生字节级等价的 canonical 领域状态。"
    verification: "纯 reducer replay/permutation 测试与稳定 JSON serialization 断言。"
    status: "pass"
  - id: "AC-002"
    statement: "两个 Item 的 delta 交错到达时，内容只写入对应 turnId+itemId，生产 adapter 不使用全 Turn 单缓冲区串写。"
    verification: "TypeScript reducer 测试、Rust private projection 测试和 Store 集成测试。"
    status: "pass"
  - id: "AC-003"
    statement: "重复 event 不重复追加文本、不重复建立 Item，也不重复应用终态；cleanup 辅助事件消费同一 eventId/sequence 游标。"
    verification: "eventId/sequence duplicate、cleanup N→N+1/duplicate/gap focused tests 与 FEAT-131 replay 回归。"
    status: "pass"
  - id: "AC-004"
    statement: "error/warning 后仍可消费正常 delta；Turn 仅由 turn.completed 封口且同步封口未完成 Item，非法终态迁移或迟到 delta 进入 recovery_required。"
    verification: "领域状态迁移、Item 原子封口、Store terminal-resync-failure 和代表性安全失败/恢复测试。"
    status: "pass"
  - id: "AC-005"
    statement: "item.completed 的最终文本与累计 delta 对账时不重复、不倒退；不一致被记录为脱敏 reconciliation_mismatch，终态 snapshot 原子合并。"
    verification: "match/mismatch/restart/history resync 测试。"
    status: "pass"
  - id: "AC-006"
    statement: "领域 adapter 对未知 item_type/event semantic 生成固定 unknown 占位且不含 raw payload；malformed private IPC 仍 fail closed 并触发 recovery。"
    verification: "unknown semantic 与 exact parser 负向测试、敏感数据 canary 扫描。"
    status: "pass"
  - id: "AC-007"
    statement: "A/B 会话快速切换后，旧 authorization/context/session/selection/draft/subscription epoch 的 history、live、artifact、draft、create、submit 和 cleanup 结果均不能污染当前会话。"
    verification: "Pinia pre/post-response、rebind、live-first、late cleanup race tests 与现有 FEAT-127/128/130 回归。"
    status: "pass"
  - id: "AC-008"
    statement: "canonical experimentalApi=false 本地入口中的固定 Runtime 普通文本 Turn 保持 ready→in_progress→completed，历史恰好一条 user 和一条 assistant，重选或重开不重复。"
    verification: "两次彼此独立的 Owner 授权各执行且只执行一次无敏感纯文本 submit；保留首次 queued 失败历史，并以第二次 valid-project fresh run 核对 Runtime hash/状态、Turn lifecycle、历史条数以及重选/重开结果。"
    status: "pass"

