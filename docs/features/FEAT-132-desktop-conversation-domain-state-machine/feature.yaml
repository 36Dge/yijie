  known_limitations:
    - Runtime may omit AgentMessage.phase; preserve absence, do not infer final_answer.
    - Legacy thread/read cannot restore every delta/Command/plan/error and may rebuild Item IDs; keep observed
      encrypted facts and mark partial.
    - Existing dynamic image tool invocation is displayed as unknown safe content; FEAT-128 Artifact resource
      independently supports preview/save/reopen.
    - Isolated Host cannot resume unrelated original Host mappings; old app histories remain readonly and may
      show permission synchronization unavailable.
    - Independent review covered the original refactor; the three D4 fixes received targeted regressions and
      final self-review, not a claimed second independent review.
