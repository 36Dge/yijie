product_ux:
  status: PASS
  primary_user: 在本地 Desktop 发起、查看和恢复 Codex 对话的用户
  problem: 原 FEAT-132 在 Vue、Native 和 Host 重复推演生命周期、最终内容与历史，需删除重复语义引擎并复用固定 Codex 原生机制。
  user_outcome: 复用固定 Codex 原生对话机制，移除重复语义状态机；保留加密产品记录和既有对话功能。
  in_scope:
    - 原生 thread/read/resume 与通知安全投影
    - 删除自建生命周期、身份猜测、正文对账与历史重建
    - 单一 Native 显示缓冲与原生事实加密保存
    - 旧记录只读兼容及后续能力回归
  out_of_scope:
    - Runtime 核心/补丁/实验 API 变化
    - FEAT-137 重启、新 Tool 能力、FEAT-152 权限语义变化
    - 推送、部署、未授权付费调用、破坏性与攻击注入测试
  main_flow:
    - Codex 原生接口/通知 → Host 鉴权、安全字段投影和传输 → Native 单一显示缓冲与加密保存 → Vue 视图
    - 原生最终 Item 替换临时内容，原生 Turn 终态原值保存；本地显示/同步错误独立
    - 每 Turn 使用明确来源的 Item 集合，不按正文/位置猜测融合；旧记录保留只读
  visual_direction: 不新增页面、视觉资产或第二套 UI；继续使用现有 Vue/Pinia/Naive UI 和易界 token。可观察变化仅限流式、错误、恢复和终态显示更准确，light/dark 与
    1180×760 现有布局不得回归。
  ui_states:
    idle: 原生视图或只读旧档案加载完成，无活跃原生执行或未确认本地提交时按权限/readiness 发送。
    loading: 正在读取历史或原子 resync；已确认的安全内容保持可读，不以空白状态覆盖。
    success: 原生执行终态准确展示；不由客户端给 Item 补造执行结果。
    empty: 新 Thread 没有 Turn/Item 时沿用明确空状态，不生成占位正文。
    error: 显示固定、脱敏且可恢复的 diagnostic code；普通 error/warning 不擅自封口 Turn。
    retry: 只通过原生读取/resume恢复；保留已有内容和 busy，不因显示失败重发任务。
    cancel: 用户中断沿用正常 interrupt 流程，保留已确认内容；不通过强杀或故障注入制造状态。
