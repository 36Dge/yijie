schema_version: 1
kind: FeatureChangeCoveragePolicy

# 本仓默认配置。兄弟代码仓必须在自己的 CI 中把 repo ID、base/head 和 required Gate
# 传给复用 CLI；中央仓无法替代兄弟仓 required check。
repository_id: yijie
feature_root: docs/features
required_gate: G3

# 规则使用 segment-aware exact/prefix，命中时选最长路径且 exact 优先。普通文档、
# 模板可由 controlled + G4（或精确 exemption）演进；下一轮会执行的 runtime TCB
# 必须走隔离的仓库外 digest 通道，避免当前 Gate policy 自我批准造成升级死锁。
protected_paths:
  - path: .github
    match: prefix
    mode: controlled_g4_or_exemption
  - path: .github/workflows
    match: prefix
    mode: external_digest_only
  - path: .github/workflows/ci.yml
    match: exact
    mode: controlled_g4_or_exemption
  - path: .github/workflows/feature-delivery-coverage.yml
    match: exact
    mode: controlled_g4_or_exemption
  - path: .npmrc
    match: exact
    mode: external_digest_only
  - path: .pnpmfile.cjs
    match: exact
    mode: external_digest_only
  - path: docs/dev/codex-feature-delivery
    match: prefix
    mode: controlled_g4_or_exemption
  - path: docs/dev/codex-feature-delivery/approval-trust.yaml
    match: exact
    mode: controlled_g4_or_exemption
  - path: docs/dev/codex-feature-delivery/change-coverage-policy.yaml
    match: exact
    mode: controlled_g4_or_exemption
  - path: docs/dev/codex-feature-delivery/gate-policy.yaml
    match: exact
    mode: external_digest_only
  - path: docs/dev/codex-feature-delivery/legacy-v1-allowlist.txt
    match: exact
    mode: controlled_g4_or_exemption
  - path: docs/dev/codex-feature-delivery/policies
    match: prefix
    mode: external_digest_only
  - path: docs/dev/codex-feature-delivery/schemas
    match: prefix
    mode: external_digest_only
  - path: docs/dev/codex-feature-delivery/schemas/approval-trust.schema.json
    match: exact
    mode: controlled_g4_or_exemption
  - path: docs/dev/codex-feature-delivery/schemas/change-coverage-policy.schema.json
    match: exact
    mode: controlled_g4_or_exemption
  - path: docs/dev/codex-feature-delivery/schemas/feature-package.schema.json
    match: exact
    mode: controlled_g4_or_exemption
  - path: docs/dev/codex-feature-delivery/schemas/gate-policy.schema.json
    match: exact
    mode: controlled_g4_or_exemption
  - path: docs/dev/codex-feature-delivery/schemas/project-config.schema.json
    match: exact
