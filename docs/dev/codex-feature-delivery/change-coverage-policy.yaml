    mode: external_digest_only
  - path: docs/dev/codex-feature-delivery/scripts/approval-attestation.mjs
    match: exact
    mode: controlled_g4_or_exemption
  - path: docs/dev/codex-feature-delivery/scripts/check-all-feature-packages.mjs
