name: CI
on:
  push:
    branches: [main, staging, develop]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - name: Audit Feature Package claims and append-only failure ledgers
        env:
          FEATURE_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z "$FEATURE_BASE_REF" || "$FEATURE_BASE_REF" =~ ^0+$ ]]; then
            echo "ERROR: immutable base commit is required for Feature Package ledger audit" >&2
            exit 1
          fi
          pnpm feature:audit -- --base-ref "$FEATURE_BASE_REF"
      - run: pnpm audit --audit-level high
      - run: bash -n scripts/*.sh
